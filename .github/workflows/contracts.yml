name: Contract validation

on:
  push:
    branches: [main]
    paths:
      - "client-projects/client101/contracts/**"
      - "client-projects/client101/changes/CHG-017*.yaml"
      - "client-projects/client101/changes/CHG-018*.yaml"
      - "client-projects/client101/changes/CHG-019*.yaml"
      - "client-projects/client101/changes/CHG-020*.yaml"
      - "client-projects/client101/evidence/CHG-017/**"
      - "client-projects/client101/evidence/CHG-018/**"
      - "tooling/validate_contracts.py"
      - "tooling/validate_chg017_approvals.py"
      - "tooling/validate_chg017_evidence.py"
      - "tooling/validate_chg018_approvals.py"
      - "tooling/validate_chg019_approvals.py"
      - "tooling/validate_chg020_approvals.py"
      - "tooling/test_chg020_validator.py"
      - "docs/architecture/backend-first-slice-decision-pack.md"
      - "docs/architecture/hosted-pilot-decision-pack.md"
      - "docs/architecture/hosted-pilot-rbac-decision-pack.md"
      - "docs/architecture/production-transition-decision-pack.md"
      - "requirements-contracts.txt"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "client-projects/client101/contracts/**"
      - "client-projects/client101/changes/CHG-017*.yaml"
      - "client-projects/client101/changes/CHG-018*.yaml"
      - "client-projects/client101/changes/CHG-019*.yaml"
      - "client-projects/client101/changes/CHG-020*.yaml"
      - "client-projects/client101/evidence/CHG-017/**"
      - "client-projects/client101/evidence/CHG-018/**"
      - "tooling/validate_contracts.py"
      - "tooling/validate_chg017_approvals.py"
      - "tooling/validate_chg017_evidence.py"
      - "tooling/validate_chg018_approvals.py"
      - "tooling/validate_chg019_approvals.py"
      - "tooling/validate_chg020_approvals.py"
      - "tooling/test_chg020_validator.py"
      - "docs/architecture/backend-first-slice-decision-pack.md"
      - "docs/architecture/hosted-pilot-decision-pack.md"
      - "docs/architecture/hosted-pilot-rbac-decision-pack.md"
      - "docs/architecture/production-transition-decision-pack.md"
      - "requirements-contracts.txt"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-contracts.txt
      - run: python tooling/validate_contracts.py
      - run: python tooling/validate_chg017_approvals.py
      - run: python tooling/validate_chg017_evidence.py
      - run: python tooling/validate_chg018_approvals.py
      - run: python tooling/validate_chg019_approvals.py
      - run: python tooling/validate_chg020_approvals.py
      - run: python tooling/test_chg020_validator.py
      - run: npx --yes @redocly/cli@2.57.0 lint client-projects/client101/contracts/openapi/buildkart-experience-v1.yaml
      - run: npx --yes openapi-typescript@7.10.1 client-projects/client101/contracts/openapi/buildkart-experience-v1.yaml --output $RUNNER_TEMP/buildkart-experience-v1.d.ts
      - run: npx --yes @asyncapi/cli@6.2.0 validate client-projects/client101/contracts/asyncapi/buildkart-events-v1.yaml
