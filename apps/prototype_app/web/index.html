<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BuildKart staging storefront (test data).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BuildKart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BuildKart</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Client-side text/PDF download used by the web invoice action.
    window.buildkartSaveText = function (fileName, contents) {
      var blob = new Blob([contents], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove any Flutter service worker and app-shell cache left by an older staging release before
    // loading the current bundle. Local storage is deliberately preserved: only offline build assets
    // are cleared. A controlled page reload is needed because an unregistered worker continues to
    // control the page that removed it until the next navigation.
    (async function loadCurrentStagingRelease() {
      if (window.location.pathname.indexOf('/current-release-') === 0) {
        window.history.replaceState({}, '', '/');
      }

      var hadController = 'serviceWorker' in navigator && navigator.serviceWorker.controller;

      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      }

      if ('caches' in window) {
        var cacheNames = await caches.keys();
        await Promise.all(cacheNames
          .filter(function (name) { return name.indexOf('flutter-') === 0; })
          .map(function (name) { return caches.delete(name); }));
      }

      if (hadController && !sessionStorage.getItem('buildkart-staging-sw-cleared')) {
        sessionStorage.setItem('buildkart-staging-sw-cleared', '1');
        window.location.reload();
        return;
      }

      var bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
