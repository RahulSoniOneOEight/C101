requirements:
- requirement_id: REQ-cart-merchandising
  statement: Show related/complementary products based on products already in the
    cart before checkout completion, with quick-add where appropriate. Recommendation
    logic must remain configurable rather than hard-coded into the UI.
  ux_impact: true
  source_refs:
  - SRC-001
  - SRC-002
  prototype_coverage:
  - surface: customer-app
    screens:
    - cart
    - checkout
    components:
    - related-products-rail
    - product-card
    - cart-line
    - quick-add
    states:
    - default
    - empty
    - loading
  - surface: web-store
    screens:
    - cart
    - checkout
    components:
    - related-products-rail
    - product-card
    - cart-line
    - quick-add
    states:
    - default
    - empty
    - loading
  - surface: b2b
    screens:
    - cart
    - checkout
    components:
    - related-products-rail
    - product-card
    - cart-line
    - quick-add
    states:
    - default
    - empty
    - loading
  decision_reason: null
  status: covered
- requirement_id: REQ-external-price-comparison
  statement: Product tiles/PDP may show comparable observed Amazon/Flipkart prices,
    clearly distinguished from own selling price. Competitor-price records must retain
    source marketplace, observed price and observation/freshness timestamp so stale
    or unavailable external prices are handled safely.
  ux_impact: true
  source_refs:
  - SRC-001
  prototype_coverage:
  - surface: customer-app
    screens:
    - product-list
    - product-detail
    components:
    - product-card
    - price-comparison
    - competitor-price
    states:
    - default
    - stale-price
    - unavailable
  - surface: web-store
    screens:
    - product-list
    - product-detail
    components:
    - product-card
    - price-comparison
    - competitor-price
    states:
    - default
    - stale-price
    - unavailable
  - surface: b2b
    screens:
    - product-list
    - product-detail
    components:
    - product-card
    - price-comparison
    - competitor-price
    states:
    - default
    - stale-price
    - unavailable
  decision_reason: null
  status: covered
- requirement_id: REQ-project-site-purchasing
  statement: A B2B account can manage multiple projects/sites and delivery locations,
    build project-specific material lists/carts/orders, and deliver orders to the
    appropriate project/location. Project/Site is a first-class business context (name,
    delivery location, material lists, RFQs/orders, purchasing history), not merely
    a saved address.
  ux_impact: true
  source_refs:
  - SRC-002
  prototype_coverage:
  - surface: b2b
    screens:
    - project-list
    - project-detail
    - material-list
    components:
    - project-card
    - project-selector
    - material-list
    states:
    - default
    - empty
    - loading
  decision_reason: null
  status: covered
- requirement_id: REQ-project-site-reorder
  statement: A B2B account can view project/site-level purchasing history and conveniently
    reorder from previous project orders or material lists.
  ux_impact: true
  source_refs:
  - SRC-002
  prototype_coverage:
  - surface: b2b
    screens:
    - project-detail
    - order-history
    components:
    - project-card
    - reorder-action
    states:
    - default
    - empty
    - loading
  decision_reason: null
  status: covered
- requirement_id: REQ-competitor-price-data
  statement: Amazon/Flipkart observed prices are external inputs supplied by a crawler/price-intelligence
    process; UX consumes normalized competitor-price data (marketplace, observed price,
    freshness timestamp).
  ux_impact: false
  source_refs:
  - SRC-001
  prototype_coverage: []
  decision_reason: null
  status: not-applicable
- requirement_id: REQ-configurable-recommendations
  statement: Cart/checkout recommendation logic must remain configurable rather than
    hard-coded into the UI.
  ux_impact: false
  source_refs:
  - SRC-001
  prototype_coverage: []
  decision_reason: null
  status: not-applicable
