motions:
- semantic_id: commerce.add-to-cart
  trigger: tap
  effect: scale
  from: 1.0
  to: 0.96
  duration_ms: 120
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: navigation.page-enter
  trigger: route-enter
  effect: fade-slide
  from: 0
  to: 1
  duration_ms: 200
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: feedback.success-rich
  trigger: success
  effect: rich-animation
  duration_ms: 800
  curve: easeOut
  flutter:
    runtime: Rive/Lottie
  web:
    runtime: Rive/Lottie
- semantic_id: navigation.tab-switch
  trigger: tab-change
  effect: fade
  from: 0
  to: 1
  duration_ms: 160
  curve: easeInOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: feedback.toast-in
  trigger: toast
  effect: slide-up
  duration_ms: 200
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: commerce.quantity-change
  trigger: tap
  effect: scale
  from: 1.0
  to: 0.92
  duration_ms: 100
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: overlay.modal-enter
  trigger: overlay-open
  effect: fade-scale
  duration_ms: 200
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: feedback.loading-spinner
  trigger: loading
  effect: spin
  duration_ms: 600
  curve: linear
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: navigation.page-exit
  trigger: route-exit
  effect: fade
  from: 1
  to: 0
  duration_ms: 160
  curve: easeIn
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: commerce.cart-badge
  trigger: add-to-cart
  effect: bounce
  duration_ms: 320
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
status: review-ready
