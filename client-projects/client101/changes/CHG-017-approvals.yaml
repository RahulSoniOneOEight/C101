instructions:
- Record one outcome per decision; silence is not approval.
- Approved-with-amendment must quote the replacement baseline or reference an approved artifact.
- Record a named accountable human, UTC timestamp, evidence and exact document/contract revision.
- Deferred or rejected required decisions block G0.
- Approved-with-amendment remains blocking until incorporated into the referenced revision and all blocking conditions are closed.
- One role's approval never substitutes for another required role.
- G0 approves governance and the verification plan only; G1 through G6 require implementation evidence.
- This ledger cannot authorise production release.
