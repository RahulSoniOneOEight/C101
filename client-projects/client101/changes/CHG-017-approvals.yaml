    subject: tax-and-invoice
    outcome: accepted
    roles: [finance-tax, legal, erp-operations]
    conditions: []
    policy:
      all_customer_facing_prices_gst_inclusive: true (B2C and B2B, app and web)
      surfaces: catalogue, product detail, quantity tiers, Quick Order, Procurement Lists, RFQ reference prices, seller quotations, cart, checkout, order confirmation
      no_surprise_gst: GST must not be added unexpectedly after displaying the selling price
      tax_breakup: taxable value and CGST/SGST/IGST breakdown may be shown separately; headline selling/payable price remains GST-inclusive
      frontend_constraint: frontend must not independently calculate or add GST; canonical commerce/tax response provides the GST-inclusive price and tax breakup
      invoice_issuer: legal supplier issues the tax invoice (BuildKart/legal selling entity for own inventory; marketplace seller for third-party supply; platform commission/service invoices separately)
      invoice_immutability: issued invoices immutable; corrections via credit/debit notes; historical records retain the original tax/commercial snapshot
      gst_tcs: Section 52 TCS framework where BuildKart is the e-commerce operator collecting for other suppliers; not for own-account sales
      b2b_gstin: capture and validate business GSTIN for GST/ITC-supported invoices
