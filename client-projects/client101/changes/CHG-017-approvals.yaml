    conditions: []
    scope: bounded-pilot
    policy:
      no_posting_from_intent_states: product view, wishlist, procurement-list edit, cart create/update, RFQ create/submit, quotation create, quotation acceptance by itself
      canonical_accounting_triggers: canonical order, payment capture/receipt, invoice issuance, fulfilment/revenue-recognition milestone, cancellation, return, refund, seller commission, seller settlement, approved reversal/correction
      pilot_mode: test-clearing/staging accounts only; no staging posting represented as statutory or final production accounting; no production books updated; no real statutory filing implied; Tryton remains the accounting projection target for staging verification
