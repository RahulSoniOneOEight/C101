# ------------------------------------------------------------- QC observations
qc_findings:
- id: Q1
  finding: >-
    GET /v1/products/{id}/bought-together is SKU-scoped: without ?sku it returns
    pair_id null even when the product is paired.
  impact: >-
    Any consumer that omits sku will never render the section. The Bought
    Together design document section 7.2 shows the endpoint returning a pair for
    ?channel alone, which is documentation drift introduced by CHG-080.
  action: correct the design document in this change
- id: Q2
  finding: >-
    The product detail endpoint returns an empty top-level best_price and puts the
    priced offer on commercial.selected_seller, while variants[].best_price
    carries the real offer id and variant_id.
  impact: >-
    Consumers reading product.best_price get nothing; the old web page only
    worked through a first-variant fallback.
  action: resolveVariant() now reads all three sources in a defined order
- id: Q3
  finding: >-
    app-staging.pinakaplay.cloud serves an untrusted certificate chain and returns
    503 when certificate verification is bypassed, on an IP where api and ops
    hosts serve trusted chains.
  impact: blocks R5 entirely
  action: issue or route a certificate for the app host, add the compose service
- id: Q4
  finding: >-
    The web surface is B2C-only; B2B pairs will not display because no
    channel=b2b caller exists.
  impact: acceptable for v1 if declared
  action: declare B2C-only scope in this change

# ------------------------------------------------------------------ verification
verification_plan:
- web_typecheck_and_build
- paired product with default SKU shows the section
- paired product with the unpaired SKU hides the section
- paired product with the paired SKU selected shows the reciprocal pair
- unpaired product hides the section and still returns 200
- checkout label and posted offerId match the displayed SKU and price
- 360 px and desktop widths, zero console errors
- hosted surface returns 200 with a trusted certificate (R5)

# --------------------------------------------------------------------- approval
approvals:
- role: requester
  decision: pending
  note: >-
    DEC-081-01 is the material one: it reverses Bought Together design Slice 5.
    Nothing in the R5 hosting scope should start before it is accepted.
