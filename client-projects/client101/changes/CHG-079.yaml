requirements:
- id: R1
  name: Direct variant creation
  outcome: >-
    Admin and Seller Product Studio can create and save 1..N direct variants
    without option axes, with add, duplicate, remove, SKU/details/image and
    structural locks for published or offered products.
  status: pass
- id: R2
  name: Bought Together merchandising
  outcome: >-
    Admin Merchandising can pair two products reciprocally; B2C and B2B product
    pages show the paired product above Related products (B2B after primary
    actions), with channel-aware pricing, out-of-stock state and audit.
  status: pass
- id: R3
  name: Product tile plus-to-stepper
  outcome: >-
    B2C and B2B product tiles replace the add-to-cart icon with a plus that
    becomes a quantity stepper, bound to the canonical cart or RFQ state, with
    MOQ/tier behavior on B2B.
  status: pass-code-with-widget-tests
- id: R4
  name: Cart-level delivery choice
  outcome: >-
    Checkout presents one Standard/Express delivery control for the cart,
    all-or-nothing availability, one delivery total and one arrival promise.
    B2B records a non-priced Standard/Priority request where no canonical
    shipping pricing exists.
  status: pass
- id: R5
  name: Final QC
  outcome: >-
    Run GPT-5.6 Sol QC after implementation and staging verification; no open
    blockers before closeout.
  status: pass
decisions:
- id: DEC-079-01
  area: Direct variant model
  approved_default: >-
    Spike zero-option variants first. If Medusa accepts multiple zero-option
    variants end-to-end, use that model. Otherwise use a reserved hidden
    technical option with unique values per variant. New products use direct
    variants; existing optioned products keep their options read-only.
- id: DEC-079-02
  area: Admin direct variants
  approved_default: >-
    Include the minimal seller selection/acting-for-seller path needed for
    Admin-created direct variants to provision seller offers and become
    publishable. Do not broaden offer ownership beyond that path.
- id: DEC-079-03
  area: Bought Together ownership
  approved_default: >-
    Experience API owns the pair store and PDP read path. Medusa admin proxies
    with merchant RBAC. Flutter app/web only; Next.js remains disabled in v1.
- id: DEC-079-04
  area: Tile quantity semantics
  approved_default: >-
    B2C plus adds one. B2B plus adds MOQ; stepper writes absolute quantity,
    minimum MOQ, step one unless a pack size is configured. Decrement at the
    minimum removes the line with Undo.
- id: DEC-079-05
  area: Delivery choice
  approved_default: >-
    Checkout-first v1. One cart-level Standard/Express segmented control,
    all-or-nothing Express availability. B2B uses a persisted
    Standard/Priority request field without shipping pricing.
- id: DEC-079-06
  area: Environment
  approved_default: Staging only. Production remains disabled and unauthorized.
