  head: 825cfd2
  staging_release: 2bdc55503
  staging_current: release-2bdc555

required_tests:
- Order page shows the action only when eligible units exist.
- Form lists only eligible lines with correct returnable quantities.
- Submit is disabled at zero units and enabled after a quantity.
- Reason list matches the API's allowed reasons.
- The API rejects an ineligible line or over-quantity even if the browser is bypassed.
- A submitted request appears on the return status page with the requested lines.
- No Medusa/Tryton rows change and no provider call is made.
- Typecheck, build, and 390/1440 browser QC pass with no console errors.

