change_id: CHG-089
revision: 1
status: implementation-source-verified
request: >-
  Let a signed-in customer start a return from their own order page in the customer web app,
  choose eligible lines and quantities, pick an allowed reason and resolution, and land on the
  return status page the marketplace already uses.
type: customer-return-initiation
extends:
- CHG-087
related:
- CHG-088
requested_by: human-requester
requested_at_utc: '2026-10-29'
drafting_source: chat-next-step-implementation
approval_required: true
approved_by: human-requester
approved_at_utc: '2026-10-29'
approval_scope: implement-next-in-app-step
implementation_authorized: true
staging_deployment_authorized: false
production_release_authorized: false

lane: A
release_mechanism:
- ui
- image-rebuild

context:
- >-
  The Experience API already exposes owner-scoped return creation
  (POST /v1/orders/{orderRef}/returns) and server-computed eligibility on the customer order read
  (return_eligibility with returnable_qty, deadline and allowed_reasons).
- >-
  The customer web app could list orders, read tracking and open an existing return, but had no way
  to start one. Only the Admin/Seller workbenches and API scripts could create the request.
- >-
  CHG-087 and CHG-088 define the lifecycle vocabulary this surface must use: a return is a request
  under review, not a refund; inspection is evidence; refund projections are simulated.

outcome: >-
  A signed-in customer can request a return for delivered, in-window units from their own order.
  Eligibility, quantities and reasons are never trusted from the browser; the server re-computes
  them. The new request appears immediately in the return detail view with the existing progress
  and simulated-refund messaging.

decisions:
- id: DEC-089-01
  area: API reuse
  proposed_default: >-
    Use the existing Experience API contract unchanged. No new endpoint, schema, event or state
    transition. Lane A, UI only.
- id: DEC-089-02
  area: Eligibility source
  proposed_default: >-
    Render only lines the server marks eligible with returnable_qty > 0. Quantity inputs are clamped
    client-side, and the API remains the authority that rejects ineligible or over-quantity lines.
- id: DEC-089-03
  area: Reason and resolution
  proposed_default: >-
    Offer only the allowed_reasons returned by the API. Resolution is refund or replacement; refund
    is labelled simulated. No free-text reason codes.
- id: DEC-089-04
  area: Idempotency
  proposed_default: >-
    The browser sends an idempotency key that is stable for an identical payload and regenerated
    when the payload changes, so a double submit cannot create two returns.
- id: DEC-089-05
  area: Boundary wording
  proposed_default: >-
    The flow states that a request is not a refund, that review is required, and that inspection and
    refund are evidence/simulation only.
- id: DEC-089-06
  area: Provider boundary
  proposed_default: >-
    No PSP, Medusa refund, Tryton stock, carrier or settlement call is added. No upload of return
    evidence; that needs object storage and stays deferred.

affected_capabilities:
- returns
- customer-post-purchase
affected_domains:
- returns
- customer-experience
affected_surfaces:
- customer-web.orders
- customer-web.returns

requirements:
- id: R1
  name: Owner-scoped entry point
  outcome: >-
    The order page shows a Start a return action only when the server reports eligible, returnable
    units, with per-line returnable quantities.
  status: pass
- id: R2
  name: Request form
  outcome: >-
    The form shows only eligible lines, clamps quantities to returnable_qty, offers the API's allowed
    reasons and both resolutions, and cannot submit zero units.
  status: pass
- id: R3
  name: Server-side authority
  outcome: >-
    The browser never supplies owner identity, eligibility or allowed reasons. The API re-computes
    eligibility and rejects invalid requests with a readable message.
  status: pass
- id: R4
  name: Idempotent submit
  outcome: >-
    Identical payloads reuse one idempotency key; a changed payload gets a new one. Double click is
    blocked while the request is in flight.
  status: pass
- id: R5
  name: Honest lifecycle messaging
  outcome: >-
    The flow and the destination page state that a request is not a refund, inspection is evidence,
    and any refund projection is simulated with no money or stock effect.
  status: pass
- id: R6
  name: Verification
  outcome: >-
    Typecheck and production build pass; browser QC at 390x844 and 1440x900 passes against the
    staging Experience API without writing data.
  status: pass

