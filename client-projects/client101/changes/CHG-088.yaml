change_id: CHG-088
revision: 1
status: staging-deployed-verified
request: >-
  Align the native Admin and Seller order-detail operations with the CHG-087 return lifecycle and
  extend order-page fulfillment controls, without replacing native Mercur order management or
  creating real refund, carrier, stock or settlement effects.
type: native-order-operations-alignment
