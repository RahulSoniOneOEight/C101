requirements:
- id: R1
  name: Admin return context
  outcome: >-
    Admin order detail shows the full CHG-087 return state, inspection evidence status and
    simulated refund projection, with a link to the return workbench.
  status: pass
- id: R2
  name: Seller return context
  outcome: >-
    Seller order detail shows scoped return and inspection status but no refund amount, breakdown,
    simulation reference, decision or closure action.
  status: pass
- id: R3
  name: No order-page closure bypass
  outcome: >-
    Receipt, inspection, refund simulation and refund-return closure are not available from the
    order page; only the full return workbench can perform them.
  status: pass
- id: R4
  name: Fulfillment depth
  outcome: >-
    Admin and Seller order pages expose partial delivery, attempts, buyer action, delay, exceptions,
    proof and per-line quantities through the existing versioned shipment API.
  status: pass
- id: R5
  name: Summary accuracy
  outcome: >-
    Order operations tiles reflect inspection pending/complete and simulated refunds without
    claiming that real money or stock moved.
  status: pass
- id: R6
  name: Verification and cleanup
  outcome: >-
    Local typecheck/build and browser QC pass at 390x844 and 1440x900, Seller redaction is proven,
    and no staging fixture or provider effect remains.
  status: pass

