staging_deployed_at_utc: '2026-10-29'
staging_release_commit: 2bdc55503

lane: B
release_mechanism:
- api+ui
- image-rebuild

context:
- >-
  The live staging order pages are native Mercur pages plus BuildKart widgets. The local
  fulfillment-preview harness was a design reference and was never registered or deployed.
- >-
  The live order-detail Returns card still uses legacy labels and actions. It can show a received
  return as "Return Completed" and does not expose CHG-087 inspection or simulated-refund context.
- >-
  CHG-087 inspection and refund workbenches are live at /dashboard/returns/:id and
  /seller/returns/:id. The order page should link to those surfaces rather than duplicate closure
  actions.
- >-
  The shipment API already supports partial delivery, attempts, buyer action, delays, damage/loss,
  RTO and Admin cancellation. The order page exposes only four delivery statuses today.

outcome: >-
  Admin and Seller order details show an accurate, role-scoped delivery and return context. The
  order page links to the correct return workbench, never presents a premature "completed" state,
  and supports the fulfillment transitions already allowed by the shipment API.

decisions:
- id: DEC-088-01
  area: Surface strategy
  proposed_default: >-
    Keep native Mercur orders list, order summary, payment and order-group pages. Enhance the
    BuildKart widgets only. Do not promote or replace native order management with the local
    fixture harness.
- id: DEC-088-02
  area: Return actions
  proposed_default: >-
    The order page may approve/reject a requested return. It must not record receipt, inspection,
    closure or a refund simulation. Those actions stay on the full return workbench.
- id: DEC-088-03
  area: Return labels and context
  proposed_default: >-
    Use the full CHG-087 lifecycle vocabulary. Received means received/inspection pending, not
    completed. Inspection complete means refund simulation pending. Closed means simulated or
    recorded workflow closure, never a real money movement.
- id: DEC-088-04
  area: Seller redaction
  proposed_default: >-
    Seller order pages show inspection status only. They never show refund amount, breakdown or
    simulation reference, and never offer decision/refund actions.
- id: DEC-088-05
  area: Fulfillment depth
  proposed_default: >-
    Derive delivery options from the shipment's allowed transitions and expose the existing
    partial-delivery, attempt, buyer-action, delay, damage/loss, RTO and Admin-cancellation fields.
    Per-line delivered quantities and proof references remain required where the API requires them.
- id: DEC-088-06
  area: Provider boundary
  proposed_default: >-
    No PSP, Medusa refund, Tryton stock, carrier, settlement or accounting mutation is added.
    Shiprocket, real refunds and real inventory disposition remain deferred.

affected_capabilities:
- order-operations
