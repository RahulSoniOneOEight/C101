change_id: CHG-019
revision: 1
request: >-
  Define and implement server-owned role assignments, tenant and seller isolation, privileged-route
  authorization and audit requirements for the 20-user bounded hosted-staging pilot. Client-supplied
  roles are never trusted. Cloudflare Access provides an additional perimeter for operator surfaces
  but never replaces application authorization. Production access and production release remain
  unauthorized.
