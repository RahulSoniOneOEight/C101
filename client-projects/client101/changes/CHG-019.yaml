required_tests:
- Role assignments load only from server-side configuration and reject unknown roles or identities.
- Client headers, request bodies and tokens cannot add or change roles, account ids or seller ids.
- Customer A cannot access Customer B orders, notifications, devices or profile.
- B2B users cannot access another business account.
- B2B buyers cannot manage membership or approve purchases.
- B2B approvers cannot manage membership, seller data, inventory or finance actions.
- Seller 1 users cannot access Seller 2 data or actions.
- Seller catalog managers cannot perform fulfilment or membership actions.
- Seller order managers cannot modify products, offers or pricing.
- Support operators cannot mutate commercial, financial, inventory or identity state.
- Marketplace operators cannot perform finance or ERP actions.
- ERP operators cannot perform payment, refund, catalogue or canonical-order actions.
- Finance operators cannot change inventory, catalogue, allocation or canonical-order state.
- Super-admin consequential actions require an audit record and independent second approval.
- Missing, expired, revoked or unassigned sessions fail closed.
- Privileged routes remain inaccessible from the public customer ingress even with a valid customer session.
constraints:
- The role plan is staging-only and limited to the approved 20 synthetic identities.
- Role assignments, business-account ids and seller ids are server-owned configuration or database state.
- Cloudflare Access is defense in depth and cannot substitute for API authorization.
- Canonical Medusa, Mercur and Tryton ownership boundaries remain unchanged.
- Privileged actions are deny-by-default and explicitly enumerated.
- No role can authorize production effects or production release.
- Secrets, Cloudflare tokens and tester configuration are never committed to Git.
- Production payment, real OTP, real logistics and production notifications remain prohibited.
