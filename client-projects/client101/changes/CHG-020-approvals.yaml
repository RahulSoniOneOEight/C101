instructions:
- Record one human-reviewed outcome per decision and required role; silence is not approval.
- Approved-with-amendment must identify the replacement baseline and incorporated revision.
- Rejected or deferred decisions block the corresponding production implementation.
- Approving gates 1..11 authorizes implementation and evidence only, never production release.
- Production release requires the separate D-020-12 decision by release-authority, executive-sponsor and security.
- D-020-12 may only be recorded after G1-G8 and cross-cutting gates are pass for one immutable release candidate.
- Never record secrets, credentials, tester data or personal data here.
