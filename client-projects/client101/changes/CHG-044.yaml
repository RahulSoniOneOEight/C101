    - handle: trade-best-deals
      id: pcol_01M53AN7M1ZAF0AWVRYM8X7CMB
  delivery_defect_fixed_and_released:
    issue: The normaliser read label from the section title and never from the authored label, so an operator's label was discarded on delivery.
    fix: label resolves from label, then title, then the registry label.
    state: released in 0ce1a4f and verified on staging; the b2b seasonal section now delivers its authored label with the title intact.
    app_deployment:
      hosting: Firebase Hosting site buildkart-staging
      url: https://buildkart-staging.web.app
