change_id: CHG-094
revision: 1
status: staging-deployed-verified
request: >-
  Fix the customer web checkout so a signed-in owner can place a B2C order. The form currently fails
  with "A pilot bearer session is required" because the session is never forwarded to the API.
type: web-checkout-session-forwarding
extends:
- CHG-084
related:
- CHG-093
requested_by: human-requester
requested_at_utc: '2026-10-29'
drafting_source: chat-fix-web-checkout-auth
approval_required: true
approved_by: human-requester
approved_at_utc: '2026-10-29'
approval_source: chat-select-web-checkout-auth
approval_scope: local-implementation-and-scoped-staging-web-deployment
implementation_authorized: true
staging_deployment_authorized: true
staging_deployment_authorized_at_utc: '2026-10-29'
staging_deploy_owner: requester-authorized-opencode-agent
staging_deployment_status: staging-deployed-verified
production_release_authorized: false

lane: B
release_mechanism:
- ui
- image-rebuild

context:
- >-
  CHG-093 found that the web checkout fails before creating a cart: /api/checkout calls
  completeCheckout(), which creates the cart without an Authorization header. POST /v1/carts is
  owner-scoped and returns 401.
- >-
  The checkout page was reachable while signed out, so the failure surfaced as a checkout error
  instead of a sign-in prompt.

outcome: >-
  A signed-out visitor opening checkout is sent to sign-in and returned to the exact checkout URL
  afterwards. A signed-in owner can place an order from the web; the server forwards the HTTP-only
  session and still treats the API's canonical order group as the only success signal.

decisions:
- id: DEC-094-01
  area: Auth model
  proposed_default: >-
    Checkout requires a signed-in owner. Anonymous checkout stays unsupported because the cart API is
    owner-scoped and guest carts would add an unowned state to the marketplace.
- id: DEC-094-02
  area: Token handling
  proposed_default: >-
    The session token stays in the HTTP-only cookie. The Next route reads it server-side and forwards
    it to the Experience API; the browser never sees the token or the API origin.
- id: DEC-094-03
  area: Return path
  proposed_default: >-
    Sign-in accepts a `next` path, restricted to a single leading slash to prevent open redirects,
    and returns the visitor to checkout after verification.

affected_capabilities:
- checkout
- customer-post-purchase
affected_surfaces:
- customer-web.checkout
- customer-web.sign-in

requirements:
- id: R1
  name: Session forwarding
  outcome: The checkout route forwards the signed-in session to every cart/checkout call.
  status: PASS
- id: R2
  name: Sign-in gate
  outcome: Opening checkout while signed out redirects to sign-in with a next path and returns afterwards.
  status: PASS
- id: R3
  name: Canonical success
  outcome: Only a server-returned order group is shown as confirmation; no client-side fabrication.
  status: PASS
- id: R4
  name: Safe next
  outcome: The next path must start with a single slash; absolute or protocol-relative URLs are ignored.
  status: PASS
- id: R5
  name: Source verification
  outcome: Typecheck, production build and a browser QC against the staging API pass.
  status: PASS
- id: R6
  name: Scoped staging release
  outcome: Only the five approved customer-web files are released from the deployed baseline.
  status: PASS
- id: R7
  name: Deployed journey and boundaries
  outcome: >-
    The deployed sign-in return and canonical checkout pass, public surfaces remain healthy, and
    refund, order-transaction, Tryton stock/shipment and external delivery-attempt counts do not move.
  status: PASS

