already_present:
- B2B buyer, account-admin, approver and seller RBAC role assignments for the 20-user pilot.
- Experience API authentication, server-owned roles, correlation and notification inbox.
- Canonical cart, shipping, simulated payment and order completion.
- B2B quotation cart, approval fixture, procurement lists and buyer/seller chat UI patterns.
- NATS and transactional event consumers for existing domain events.
missing:
- A Workspace bounded context and database.
- Durable channels, messages, mentions, read cursors and product-share references.
- Immutable purchase-draft revisions and a server-computed commercial hash.
- Proposal, accept/edit/reject, approval and activity workflows.
- Revalidation preview with structured differences.
- Idempotent revision-to-Medusa-cart handoff.
- Workspace UI for mobile and large screens.
- Workspace event schemas and notification projection.
decisions_proposed:
- D-070-01: >-
    Add Workspace as a bounded context owning workspaces, membership projections, channels,
    messages, product-share references, purchase drafts and immutable revisions, proposals,
    approvals, activity events, checkout handoff records and its transactional outbox. It does not
    own carts, orders, payments, inventory, products, prices, sellers, business membership or
    notification inboxes.
- D-070-02: >-
    Use PostgreSQL for durable state, REST for writes and history, and a cursor-based WebSocket feed
    for live updates behind a ConversationTransport interface. Do not operate Matrix/Synapse for
    Pilot 1; reassess only when attachments, seller participation or advanced messaging justify it.
- D-070-03: >-
    Bind every approval to one immutable draft revision and its server-computed commercial hash.
    Material price, tax, shipping, quantity, seller, offer, destination or instruction changes create
    a new revision and invalidate approval. Ordinary comments never invalidate approval.
- D-070-04: >-
    Expose all workspace operations through the Experience API. Workspace never calls Medusa, Mercur
    or Tryton directly. Revalidation and cart materialisation run through the existing commerce
    orchestration boundary with an idempotency key derived from draft, revision and hash.
- D-070-05: >-
    Derive tenant, business account, seller and roles only from signed server context. Enforce
    account scope on every row and query and add PostgreSQL row-level security as a deny-by-default
    second layer. Client-supplied role, account or tenant identifiers are ignored.
- D-070-06: >-
    Pilot 1 is B2B only. B2C household/project collaboration, seller participation, attachments,
    natural-language commands, voice/video, presence, typing indicators, multi-level approval and
    automated seller substitution are deferred.
- D-070-07: >-
    Emit workspace events through a transactional outbox to NATS. The existing Experience API
    notification projection owns inbox records, device tokens and FCM delivery evidence; the
    Workspace Service does not create a second notification system.
- D-070-08: >-
    Approvers cannot edit the revision they approve. No self-approval where policy prohibits it.
    Checkout is allowed only for an approved revision that still passes fresh revalidation.
open_decisions:
- OD-070-01: >-
    Approve message and approval-evidence retention, legal hold and deletion rules. Proposed staging
    baseline: retain pilot workspace data for the pilot period; production retention requires
    Legal/Privacy approval.
- OD-070-02: >-
    Approve the Pilot 1 approver policy: one approver, self-approval prohibited, and whether the
    requester may also be the buyer. Proposed: one approver from the same business account, distinct
    from the requester and from the buyer who edited the revision.
- OD-070-03: >-
    Approve the production realtime topology after the REST/WebSocket pilot is measured. Matrix
    remains deferred.
- OD-070-04: >-
    Approve the exact audited read-only operator troubleshooting scope and the redaction rules for
    message bodies and commercial data.
- OD-070-05: >-
    Approve whether the Workspace Service receives its own PostgreSQL database in staging or a
    dedicated schema in the existing cluster. The default architecture is a separate database.
required_approvals:
- product
- architecture
- security
- marketplace
- finance
- operations
- integration-owners
- legal-privacy
- release-authority
constraints:
- No silent commercial change; chat and collaborator actions never create an order directly.
- Medusa, Mercur, Tryton and Commerce business-account membership remain authoritative.
- Workspace must not duplicate carts, orders, notifications, device tokens, products, prices or stock.
- Every transactional command requires authentication, idempotency key, expected version/If-Match,
  correlation id and a stable problem response.
- Activity events are append-only and tenant scoped.
- Staging uses synthetic data and simulated payment only.
- No production release, real payment, real OTP, real logistics or production notifications.
required_tests:
- Tenant isolation across workspaces, channels, drafts, revisions, proposals and activity.
- Exact revision reconstruction from immutable line revisions and canonical payload.
- Material change invalidates approval; ordinary discussion does not.
- No unauthorised self-approval and no approver edit of the approved revision.
- Exactly one same-version proposal succeeds; stale clients receive current version and a diff.
- Price, stock, MOQ, tax, seller, offer, destination and serviceability revalidation.
- No automatic seller/offer substitution and no silent quantity reduction.
- One approved revision creates at most one canonical order.
- Membership revocation ends REST and WebSocket access promptly.
- NATS/FCM/WebSocket failure cannot alter commercial state.
- Reconnect produces no missing or duplicate events.
- Correct business-account pricing context for every participant.
- Mobile conversation opens without losing shop or cart state.
- WCAG 2.2 AA keyboard, focus, screen reader, target size and contrast checks.
- Push, logs and events contain no unnecessary PII.
