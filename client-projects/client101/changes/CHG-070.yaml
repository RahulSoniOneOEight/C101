change_id: CHG-070
revision: 2
request: >-
  Implement the B2B collaborative workspace pilot described in the BuildKart Collaborative
  Workspace Implementation Note: shared channels, product sharing, immutable purchase-draft
  revisions, proposals, revision-bound approval, revalidation, and an idempotent handoff to the
  existing staging checkout. Chat and collaboration must never become the source of truth for
  commerce.
