change_id: CHG-093
revision: 1
status: qc-complete
request: >-
  Establish whether a B2C and a B2B order can be placed on staging and QC the resulting flows.
type: order-flow-verification
extends:
- CHG-086
- CHG-087
related:
- CHG-089
- CHG-091
requested_by: human-requester
requested_at_utc: '2026-10-29'
drafting_source: chat-place-b2c-b2b-orders
approval_required: false
implementation_authorized: false
staging_deployment_authorized: false
production_release_authorized: false

lane: verification
environment: staging
release_under_test: 23bb1040d

outcome: >-
  A B2C order can be placed through the authenticated app/API path and is visible in the customer
  web, Admin and the owning Seller, with a booked simulated shipment and an in-app confirmation. The
  customer web checkout cannot place an order because it does not forward the session. No B2B order
  can be placed: the app writes local state only and the API cart prices B2B lines at the B2C amount,
  with the B2C FLAT5 promotion applied.

findings:
- id: F1
  severity: high
  area: b2c-web-checkout
  statement: >-
    Submitting the web checkout as a signed-in owner fails with "A pilot bearer session is required";
    /api/checkout creates the cart without forwarding the session token.
  fixed_by: CHG-094
  evidence: web/checkout-result.png
- id: F2
  severity: high
  area: b2b-ordering
  statement: >-
    B2B placeOrder in the app only mutates local state; no cart, checkout or order API is called, and
    no canonical B2B order can exist.
  evidence: apps/prototype_app/lib/providers/b2b_trade_providers.dart:1548
- id: F3
  severity: high
  area: b2b-pricing
  statement: >-
    A b2b-tagged cart prices the line at the B2C amount (₹400) instead of the B2B amount (₹350) and
    auto-applies the B2C FLAT5 promotion, producing ₹380. Completing it would create a mispriced
    "B2B" order.
  evidence: b2b probe; cart_01M623F1HHR74KGVYBEQEBEMVC
- id: F4
  severity: medium
  area: payment-linkage
  statement: >-
    The simulated payment session remains authorized on the cart; no order_payment_collection link is
    created for the completed order, which stays pending with Paid Total ₹0.
- id: F5
  severity: medium
  area: erp-reservation
  statement: >-
    No Tryton reservation or stock move is created by checkout. 0 of 161 correlations have a
    tryton_move_id; reservation is empty. The reserve/commit endpoints exist but no client calls them.
- id: F6
  severity: low
  area: seller-ux
  statement: >-
    A Seller opening another Seller's order gets a generic "An error occurred" page instead of a
    scoped not-found state. The owning Seller renders normally.

