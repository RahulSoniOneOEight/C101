change_id: CHG-041
revision: 2
request: >-
  Fix the staging banner editor failure where saving an existing banner draft returns Internal
  Server Error. Add reproducible integration coverage for the private operator-content mutation
  path before applying and deploying the correction.
type: cms-draft-save-reliability-fix
extends:
- CHG-040
affected_capabilities:
- editorial-content
- operator-administration
- auditability
affected_domains:
- content
- experience
affected_surfaces:
- mercur.admin.content-editor
- medusa.admin.buildkart.content-api
- strapi.operator-content-api
reported_symptom:
  environment: staging
  operation: update-existing-banner-draft
  operator_message: Internal Server Error
diagnosis:
  content_kind: banner
  document_id: sobtrqtdlynx04b556kshskg
  root_cause: >-
    The optional segments JSON field reached Strapi as an empty string. Strapi passed that value to
    PostgreSQL jsonb, which rejected it because an empty string is not valid JSON.
  publication_impact: none
  failed_attempts_audited: 3
decisions:
  D-041-01: reproduce-the-update-through-the-compiled-strapi-runtime-before-fixing
  D-041-02: preserve-the-private-medusa-to-cms-boundary-and-server-side-secret
  D-041-03: return-a-safe-actionable-error-with-a-correlation-id-instead-of-an-opaque-500
  D-041-04: retain-audit-recording-for-started-succeeded-and-failed-mutations
  D-041-05: normalize-an-empty-optional-json-value-to-null-at-the-editor-and-private-cms-boundary
required_tests:
- A published seeded banner can be loaded through the operator-content API.
- Updating its draft through the operator-content API succeeds.
- The updated document is returned and remains unpublished until explicit publication.
- A failed CMS mutation returns a safe actionable message and correlation identifier.
- CMS build and operator mutation integration smoke test pass.
- Mercur Admin lint and build continue to pass.
constraints:
- Never expose CMS credentials or production content.
- Do not bypass server-side validation or audit logging.
- Do not publish during the update-draft test.
- Staging only; production release remains unauthorized.
approval_required: true
implementation_request:
  requested_by: human-requester
  requested_at_utc: '2026-10-16'
  scope: diagnose-and-fix-banner-draft-save
  human_retest_required: true
implementation:
  branch: feat/medusa-native-merchandising-admin
  local_verification:
  - Live CMS and PostgreSQL logs identify the invalid empty JSON value for banner segments.
  - Empty optional JSON is normalized to null in the editor and the private CMS boundary.
  - The integration smoke test mirrors the failing empty-string payload and verifies draft-only save.
  - A forced failed mutation verifies a safe correlation reference without internal database detail.
  - CMS build, Mercur Admin lint/build and the CMS operator client unit test pass.
  hosted_deployment: pending
implementation_evidence:
- client-projects/client101/evidence/CHG-041/banner-draft-save-diagnosis.md
status: local-fix-validated-awaiting-ci-and-staging-deployment
production_release_authorized: false
