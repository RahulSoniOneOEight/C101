implementation_authorized: true
staging_data_write_authorized: true
staging_deployment_authorized: true
production_release_authorized: false

lane: C
release_mechanism:
- api+ui
- image-rebuild
- governed-data-update
release_under_test: 186a50f8f69c5d9d436ab53c8c7e8dbf1c270f5
environment: staging

outcome: >-
  A B2B buyer can place one canonical order from the B2B app. The cart carries channel=b2b,
  uses the B2B trade price from the customer-group price list, completes through the
  simulated payment path, and the resulting order group is visible in Admin with the B2B
  channel and matching total.

requirements:
- id: R1
  name: Canonical B2B order
  outcome: B2B Place Business Order creates a Medusa cart, completes it, and returns an order group ID.
  status: pass
- id: R2
  name: B2B pricing
  outcome: B2B cart line uses the saved trade price, not the B2C price, and does not apply B2C-only discounts.
  status: pass
- id: R3
  name: Admin visibility
  outcome: The same order group is visible in Admin with channel=b2b and the canonical total.
  status: pass
- id: R3a
  name: Admin B2B identification
  outcome: The Admin order detail shows an explicit B2B trade badge and business-account context even though the shared Medusa sales channel is B2C.
  status: pass
- id: R4
  name: No mispriced order
  outcome: Checkout aborts before completion if the canonical cart total does not match the app's B2B expected total.
  status: pass
- id: R5
  name: Data safety
  outcome: Existing B2B Studio price-list rules/amounts are corrected idempotently; no schema or production change.
  status: pass
- id: R6
  name: Verification
  outcome: Flutter analyze/tests, API probe, browser QC, Admin readback and evidence recorded.
  status: pass

