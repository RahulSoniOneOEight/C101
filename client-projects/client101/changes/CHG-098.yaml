change_id: CHG-098
revision: 1
status: staging-deployed-verified
request: >-
  Fix the B2B checkout so "Place Business Order" creates a canonical order instead of
  writing app-local state only, apply the correct B2B trade price through the existing
  customer-group price list, and verify the same order in Admin.
type: b2b-order-checkout
extends:
- CHG-093
