approval_dependencies:
- Q-005A ownership and responsibility matrix is resolved for the vertical slice
- identity and OTP provider direction is approved
- staging-simulator boundary, adapter contract and provider deferral are approved
- real payment provider evidence is deferred and does not block only the approved staging increment
- COD remains disabled until eligibility, collection and reconciliation policies are approved
- logistics provider sandbox and serviceability direction is approved
- landed-price formula, offer eligibility and seller tie-break policy are approved
- inventory reservation point, timeout and release policy are approved
- split-order, split-shipment and customer charge presentation are approved
- tax display and calculation authority are approved per B2C and B2B channel
- API topology, provider versions, environment and deployment baseline are approved
- Revision 5 affected decisions D-017-10, D-017-17, D-017-20, D-017-21 and D-017-23 have named outcomes and accountable approvers
- measurable service targets, load profile, RPO and RTO are approved
unresolved_provider_and_environment_details:
- exact Medusa, Mercur, Tryton and PostgreSQL versions; Meilisearch version or explicit first-slice exclusion
- identity and OTP provider plus sandbox capability evidence
- Razorpay candidate, prepaid method, webhook, query and refund capability evidence for later provider G3 and production readiness
- logistics provider, sandbox geography, booking and tracking capability evidence
- queue or broker, object storage and notification providers
- development, CI, integration, staging and pre-production environment owners
- secret manager, access, rotation, observability and on-call ownership
- peak request rate, concurrency profile and approved load targets
- approved RPO, RTO, backup and restore evidence plan
- buyer, business-account, seller and operator membership-rule evidence
- tax calculation, invoice issuer/timing/numbering/correction and reconciliation policy evidence
- accounting trigger, mapping, writer, reversal and reconciliation evidence
- Tryton reservation concurrency, atomic expiry/commitment and idempotent recovery evidence
- functional Medusa staging persistence and recovery evidence
- functional Mercur offer, eligibility and allocation evidence
- functional Tryton movement and staging accounting projection evidence
- cross-system reconciliation and shared-client connectivity evidence
- environment endpoint, service identity and unsafe-routing guard evidence
slice_boundaries:
  buyer_contexts: [b2c, b2b]
  checkout_seller_count: 1
  fulfilment_context_count: 1
  destination_count: 1
  shipment_count: 1
  currency: INR
  reservation_ttl_minutes_proposed: 15
  exclusions:
  - b2b-credit-and-approval-purchasing
  - partial-payment
  - split-fulfilment
  - automatic-seller-substitution
  - full-customer-returns
  - seller-settlement-execution
  - rfq-conversion
  - cms-provider-selection-and-dam-workflows
  - production-release
  - real-payment-provider-integration
constraints:
- Commerce remains the canonical commercial order aggregate/lifecycle and B2B credit owner; Medusa with governed BuildKart extensions is the order implementation foundation
- Mercur remains the canonical seller, offer and allocation owner
- Tryton remains the canonical ATP, reservation and warehouse-movement owner
- Tryton or the approved accounting boundary owns invoice and accounting records, subject to Finance/Tax approval
- payment and shipment results remain owned by their integration providers
- Commerce payment and logistics integrations own normalised order-linked projections
- staging test-order confirmation requires backend-recorded simulated acceptance; provider/production confirmation requires captured payment
- inventory reservation occurs before payment and is atomically committed before customer confirmation
- one seller, fulfilment context, destination and shipment are enforced per checkout while other seller groups remain in the cart
- unsupported provider physical splits create an exception and cannot silently change customer charges or promises
- the proposed reservation TTL is configurable, audited and does not extend existing reservations
- COD is disabled and outside the prepaid slice; future COD policy does not block prepaid G0 while COD remains unavailable
- simulated payment is development/staging-only, explicitly labelled and server-selected
- production fails closed when simulated payment is configured and never falls back to simulation
- simulated refund transitions are workflow evidence, not financial refund evidence
- Razorpay remains a planned deferred candidate and E-017-003 cannot be accepted without sandbox proof
- Medusa, Mercur and Tryton must be functional staging services; payment simulation cannot replace their behavior
- simulated markers propagate through all downstream records and reconciliation views
- staging accounting uses an approved test-clearing treatment and cannot represent bank receipt
- environment-specific endpoints and credentials are mandatory; unsafe production routing fails closed
- dependency failures are classified retryable, terminal or ambiguous before recovery action
- rejected or deferred required decisions block G0
- approved-with-amendment decisions block G0 until incorporated and blocking conditions are closed
- G0 approves governance and the verification plan only; G1 through G6 require implementation evidence
- Release Authority is accountable for approval governance; Architecture and Security approve the mechanism; other roles acknowledge it through their decision records
- CMS may own editorial app-shell content only and must not own price, stock, seller, eligibility, payment, credit, allocation, order or accounting state
- Meilisearch remains a derived index
- clients must not compose provider responses to decide transactional eligibility
- no production success may be simulated without a canonical backend result
- fixtures and local fallbacks must remain explicitly development-only
