required_tests:
- shared OpenAPI and event schemas pass lint and backward-compatibility checks
- app, web, seller and operational surfaces consume the shared backend rather than local success flags
- Medusa persists the canonical staging cart, checkout reference and test order
- Mercur supplies actual staging offers/eligibility and records confirmed allocation
- Tryton supplies actual staging ATP, reservation, commit/release, movement and approved accounting projection
- checkout, Medusa order, Mercur allocation, Tryton reservation/movement and accounting references reconcile by correlation id
- Flutter and web consumer contract tests pass against the shared experience API
- identity, role and tenant-isolation tests pass for buyer, seller and operator contexts
- seller-aware cart preserves variant, seller, offer and fulfilment identity
- explicit seller selection is never silently replaced
- price, MOQ, stock, eligibility and serviceability are revalidated at cart and checkout
- concurrent checkout does not oversell constrained inventory
- duplicate checkout requests and simulated payment results produce one canonical staging outcome
- no customer success state is possible without a canonical order reference
- canonical order lines reconcile to marketplace allocations and inventory reservations
- payment, ERP and logistics failures are classified retryable, terminal or ambiguous and visible to operators
- outbox/inbox duplicate, replay and out-of-order event tests pass
- order, allocation, payment, reservation and shipment share a traceable correlation id
- commerce-admin order workbench passes RBAC, accessibility and responsive visual checks
- recovery runbook and reconciliation drill complete without direct database edits
- one-seller-per-checkout scope is enforced while other seller groups remain in the cart
- durable checkout attempt is persisted before reservation or payment side effects
- staging confirmation is impossible until canonical test order, confirmed allocation, committed reservation and backend-recorded simulated payment acceptance hold
- provider/production confirmation remains impossible without verified captured payment
- reservation commit and expiry are atomic competing transitions and only one can succeed
- late captured payment rechecks and re-reserves inventory or enters durable refund recovery
- action-level permissions and independent second approval are enforced for configured consequential actions
- simulated pending and late outcomes reconcile by operation key before any repeated side effect
- simulated accepted-but-unfulfillable flow enters test recovery and produces an idempotent simulated refund outcome
- simulated adapter supports success, failure, pending, duplicate, late and refund transitions
- clients cannot select the simulated adapter or manufacture simulated success
- production startup fails or checkout is disabled when simulated payment is configured
- provider failure never falls back to the simulated adapter
- simulated orders, payments and refunds are clearly marked as test data
- simulation/test markers persist through allocation, inventory, accounting, audit and operational projections
- staging accounting uses approved test-clearing treatment and never claims bank receipt
- unsafe routing to production ERP, live payment, production logistics or customer notifications fails closed
- editorial CMS content cannot determine transactional eligibility, price, stock, seller, payment or order success
- shipment and accounting failures remain separate from canonical commercial order state
- G0 through G6 evidence is traceable to the exact contract and release-candidate revision
