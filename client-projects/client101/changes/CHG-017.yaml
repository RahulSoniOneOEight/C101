change_id: CHG-017
revision: 5
request: >-
  Establish the governed contract baseline and implement the first production-shaped
  BuildKart marketplace-order vertical slice: authenticated buyer, composed product
  and eligible seller offers, explicit seller selection, seller-aware canonical cart,
  durable checkout attempt, serviceability/tax/inventory revalidation, inventory
  reservation before payment, explicitly simulated staging payment, functional Commerce-owned
  canonical order implemented through Medusa, actual staging Mercur seller allocation, committed
  Tryton reservation/movement and approved staging test-clearing accounting projection,
  Tryton invoice/accounting projection, logistics shipment projection,
  and customer/operator order visibility. The work includes the minimum backend
  administration UI needed to inspect the order, allocation and integration failures.
