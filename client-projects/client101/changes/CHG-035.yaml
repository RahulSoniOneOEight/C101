change_id: CHG-035
revision: 1
request: >-
  Refine the common commerce and CMS administration experience into one logically organised,
  Medusa-native Merchandising workspace. Operators must be able to review and update editorial
  items, compare governed merchandising presets with live commerce records, and open promotions,
  campaigns, collections and categories in their authoritative native editors.
type: operator-merchandising-workspace-refinement
extends:
- CHG-029
- CHG-030
- CHG-034
affected_capabilities:
- operator-administration
- editorial-content
- storefront-composition
- promotions
- marketplace-merchandising
affected_domains:
- experience
- content
- commerce
- marketplace
affected_surfaces:
- mercur.admin.merchandising
- mercur.admin.content
- mercur.admin.promotions
- mercur.admin.campaigns
- mercur.admin.collections
- mercur.admin.categories
affected_entities:
- storefront-layout
- banner
- curated-collection
- category-editorial
- product-editorial
- faq-article
- promotion
- campaign
- merchandising-preset
affected_integrations:
- mercur-admin-to-medusa-content-facade
- medusa-content-facade-to-private-strapi
- medusa-admin-to-promotion-module
affected_events:
- cms.entry.publish
- cms.entry.unpublish
decisions:
  D-035-01: one-top-level-merchandising-workspace-organises-editorial-and-commerce-tools
  D-035-02: editorial-records-use-medusa-native-list-drawer-form-and-confirmation-patterns
  D-035-03: commerce-promotions-and-campaigns-open-in-the-existing-native-medusa-editors
  D-035-04: governed-preset-definitions-remain-read-only-baselines-and-are-compared-with-live-records
  D-035-05: no-duplicate-promotion-or-campaign-write-api-is-created
  D-035-06: cms-remains-editorial-only-and-commerce-remains-authoritative-for-transactional-fields
  D-035-07: dangerous-publish-and-unpublish-actions-require-explicit-operator-confirmation
  D-035-08: raw-json-is-limited-to-structured-layout-fields-until-a-governed-module-builder-is-approved
required_tests:
- One Merchandising sidebar entry provides overview, editorial content and preset review navigation.
- Existing `/content` and `/merchandising-presets` links remain compatible or redirect safely.
- CMS create and edit actions use a Medusa drawer and preserve explicit draft-only save semantics.
- Publish and unpublish actions require confirmation and still create operator audit records.
- The preset review shows whether each governed campaign and promotion resolves to a live Medusa id.
- Live campaigns and promotions link to their native Medusa detail editors.
- CMS collections link to the editable curated-collection view while commerce categories stay native.
- Preset and offer-lab screens never directly mutate promotion values, budgets or funding.
- Invalid and commerce-owned CMS fields remain rejected by the server boundary.
- Admin, CMS and backend builds pass with no second UI framework or hardcoded visual tokens.
constraints:
- Staging only; no production release or production content migration.
- Use `@medusajs/ui`, `@medusajs/icons` and public Mercur dashboard primitives only.
- No iframe and no direct browser-to-Strapi call.
- No duplicate commerce write model in CMS or the preset catalogue.
- Existing media references are preserved; media upload remains deferred.
- Promotion funding, stacking, GST and commission treatment remain subject to Finance/Tax approval.
- Production release remains unauthorized.
approval_required: true
implementation_request:
  requested_by: human-requester
  requested_at_utc: '2026-10-13'
  scope: bounded-hosted-staging-admin-refinement
  human_visual_review_required: true
production_release_authorized: false
implementation:
