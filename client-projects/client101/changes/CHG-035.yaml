change_id: CHG-035
revision: 2
request: >-
  Implement Phase 1 of delivery capture and returns for the staging pilot: durable shipment and
  append-only event persistence, allocation-driven booking, delivery evidence, customer shipment
  reads, authenticated operator simulation/reconciliation, return cases with policy snapshots and
  idempotent requests, admin shipment and return workbenches, and an API-backed customer timeline
  and return flow. Returns must have no Medusa money effect and no Tryton stock effect.
type: delivery-capture-and-returns
extends:
- CHG-017
affected_capabilities:
- fulfilment
- delivery-evidence
- returns
- ops-exceptions
- customer-orders
- notifications
affected_domains:
- commerce
- marketplace
- logistics
- experience
- operations
- integration
- notifications
affected_surfaces:
- app.prototype.b2c-storefront
- app.prototype.b2b-trade
- experience-api.logistics
- experience-api.returns
- commerce-admin.shipments
- commerce-admin.returns
- commerce-admin.orders.detail
- commerce-vendor.shipments
- commerce-vendor.returns
- ops-console.integration-exceptions
already_present:
- >-
  CHG-017 defines marketplace allocation, commerce shipment projection and provider execution
  evidence ownership.
- >-
  The staging order read, checkout completion and operator audit patterns exist in the Experience
  API.
- >-
  The notification template registry and source-event dedupe index exist.
- >-
  Customer order history is seeded in Flutter and is not yet API-backed.
missing:
- >-
  Shipments are held in an in-memory Map and do not survive a service restart.
- >-
  Shipment booking is triggered from the wrong point and is not keyed by a Mercur allocation.
- >-
  There is no durable shipment event store, per-line delivered quantity, proof reference or
  delivery evidence read.
- >-
  POST /v1/shipments/{id}/advance has no authentication and is not a safe replacement for an
  operator simulation endpoint.
- >-
  There are no authenticated shipment, exception or reconciliation admin routes.
- >-
  There are no return cases, return lines, evidence references, policy snapshots, decisions or
  return events.
- >-
  There are no return eligibility rules or return notification templates.
- >-
  The Flutter order provider is synchronous and seeded; the order detail and track-package screens
  cannot consume an API-backed shipment timeline or return eligibility.
proposed_decisions:
- D-035-01: >-
    Create one durable shipment per Mercur marketplace allocation and book from a durable
    marketplace-allocation.created consumer. order.confirmed remains an order-timeline and
    notification trigger, not the booking trigger.
- D-035-02: >-
    Persist shipments and append-only events in Postgres using the notification-store pattern:
    pooled connection, idempotent schema, partial unique indexes and explicit staging/test markers.
- D-035-03: >-
    Apply a monotonic status-rank state machine. Persist every event; only a higher rank changes
    status; same-rank corrections require an audited reconcile, never a normal event.
- D-035-04: >-
    Delivery evidence records delivered_at, per-line delivered_qty and a proof reference. Phase 1
    stores evidence references only, never binaries in Postgres.
- D-035-05: >-
    Compute return eligibility per order line from delivered shipment state, the policy window,
    already-requested quantity, reason/category rules and order cancellation. Freeze the policy
    version and inputs onto the case at request time.
- D-035-06: >-
    A return request is idempotent by (user_id, idempotency_key). Replay with the same payload
    returns the existing case with 200; reuse with different payload returns 409.
- D-035-07: >-
    Returns are workflow evidence only in Phase 1: no refund execution, no Medusa money mutation,
    no Tryton movement or stock mutation. Phase 1 decisions stop at approved or rejected.
- D-035-08: >-
    Every operator route requires in-handler authentication, explicit role gating before the admin
    catch-all, and a privileged audit record. The open customer shipment booking/advance endpoint
    is removed.
- D-035-09: >-
    Migrate the Flutter order provider to an asynchronous API-backed provider, remove the seeded
    order success path, and render shipment timelines and return eligibility from the server.
- D-035-10: >-
    Add delivery_delivered_v1, delivery_exception_v1, return_requested_v1 and return_decision_v1
    templates while preserving source-event dedupe.
- D-035-11: >-
    Embed a read-through delivery and returns panel on the native Mercur order detail page. Resolve
    the Medusa seller order through its Mercur order group, then read shipment and return truth from
    the Experience API; do not duplicate lifecycle ownership in the dashboard.
- D-035-12: >-
    Create deterministic staging lifecycle fixtures through the real checkout, seller shipment and
    customer return APIs so the operational workbenches contain booked, in-transit, exception,
    delivered, requested, approved and rejected examples. Fixture creation remains staging-only.
open_decisions:
- id: OD-035-01
  decision: Final return window and category/reason matrix
  proposed: Seven calendar days from delivery; damaged, wrong item and not-as-described
  blocks: Runtime eligibility and return flow
- id: OD-035-02
  decision: Evidence upload versus reference-only in Phase 1
  proposed: Reference-only, no binary storage or virus scanning
  blocks: Return evidence UI and storage
- id: OD-035-03
  decision: Return approver roles
  proposed: support_operator and marketplace_operator, with super_admin override
  status: resolved
  resolution: >-
    Admin approves or rejects returns; the seller follows the admin decision and cannot approve or
    reject a return.
  resolved_by: human-requester
  resolved_at_utc: '2026-10-21'
  blocks: Admin decision authorization
- id: OD-035-04
  decision: Whether an approved return changes the order stage
  proposed: No; return status remains a separate field and the order stays Delivered
  blocks: App/order projection
constraints:
- Staging only; production release remains separately human-authorized.
- test_data=true, environment=staging and logistics_mode=simulated on every shipment, event,
  return, decision and notification.
- No real carrier integration, pickup scheduling or seller-side return handling in Phase 1.
- No refund execution, payment-provider call, Medusa money mutation or Tryton stock/movement effect
  from a return.
- No attachment binaries in Postgres; store references and metadata only.
- Do not make the layout/CMS, app or admin console authoritative for eligibility, price, stock,
  seller, shipment status or order success.
- Booking must not be coupled to checkout completion; allocations are asynchronous.
- Do not leave a customer-facing shipment booking/advance endpoint without authentication.
- Do not silently edit the CHG-017 approvals ledger.
required_tests:
- Duplicate provider events produce one row and one status outcome.
- An out-of-order event after delivered does not move status backwards.
- A shipment record survives a new store/service instance.
- One shipment exists per Mercur allocation and booking is idempotent.
- Unauthenticated shipment/return operator calls return 401; an ordinary customer gets 404;
  an authorized operator gets 200.
- Simulated failed, damaged, lost, RTO, duplicate and out-of-order scenarios produce the expected
  timeline and exception state.
- Reconcile repairs only policy-approved inconsistency and writes an audit record.
- Return eligibility covers delivered/in-window, expired, over-quantity and non-delivered branches.
- Return replay with the same key/payload returns the same case with 200; different payload returns
  409.
- Return requests preserve the policy snapshot and never call Medusa or Tryton.
- Return operator decisions are authenticated, role-gated and audited.
- Customer order detail returns lines, shipments and per-line eligibility.
- Flutter order history, order detail and track-package render API data with loading, empty and error
  states.
- Chrome/Flutter checks pass at the target mobile widths with no console errors.
