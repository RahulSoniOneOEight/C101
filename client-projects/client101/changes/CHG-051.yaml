change_id: CHG-051
revision: 1
request: >-
  Fill B2B quantity tiers with a 5% discount step, rotate both channel heroes every 5 seconds, and
  implement the P0 customer path for the configured promotions so a shopper can enter a code, see the
  discount and understand a rejection.
type: staging-trade-tiers-banner-and-promotion-p0
extends:
