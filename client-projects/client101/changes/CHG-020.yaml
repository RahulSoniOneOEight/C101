change_id: CHG-020
revision: 1
request: >-
  Establish the governed path from the bounded hosted-staging pilot to a production release. This
  contract enumerates the production gates that must be closed, the provider and assurance
  obligations they carry, and the separate, explicitly recorded production-release authorization.
  Approval of an individual gate authorizes implementation and evidence only. Production release
  requires the dedicated release-authorization decision (D-020-12) with its own accountable roles.
  Nothing in this contract authorizes production effects until that decision is recorded and its
  gate evidence is accepted.
