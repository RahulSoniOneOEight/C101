required_tests:
- Every G1-G8 gate has linked, accepted evidence for an immutable release candidate.
- No simulated provider (payment, OTP, logistics, notifications) is reachable in production mode.
- Production configuration rejects development/staging simulation and demo endpoints.
- Cross-tenant and cross-seller isolation holds under production identities.
- Payment, refund and settlement reconciliations pass against the production provider.
- Inventory cannot oversell against the authoritative projection under concurrent load.
- Signed provider webhooks are verified, deduplicated and replayed safely.
- Backups restore to approved RPO/RTO on the production topology.
- Rollback or forward-fix is demonstrated without canonical data loss.
- Customer, seller and admin critical paths meet WCAG 2.2 AA.
- Named UAT approvers sign the exact release candidate.
constraints:
- staging remains the only authorized runtime until D-020-12 is recorded and accepted.
- Simulated payment, shared test OTP and simulated logistics are prohibited in production.
- Production customer data, providers and release remain unauthorized until their gate decisions pass.
- Production secrets, keystores and credentials are never committed to Git or recorded in chat.
- Numeric RPO/RTO, SLO and performance targets require explicit human approval.
- No role, and no agent, may self-authorize production release.
- This contract does not modify canonical entity ownership.
