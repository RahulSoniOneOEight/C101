change_id: CHG-091
revision: 1
status: implementation-source-verified
request: >-
  Give a signed-in customer one place to see every return they have requested, with status, reason,
  date and a link to the return detail, reachable from the primary navigation.
type: customer-returns-index
extends:
- CHG-089
requested_by: human-requester
requested_at_utc: '2026-10-29'
drafting_source: chat-next-steps-can-implement
approval_required: true
approved_by: human-requester
approved_at_utc: '2026-10-29'
approval_scope: implement-next-in-app-step
implementation_authorized: true
staging_deployment_authorized: false
production_release_authorized: false

lane: A
release_mechanism:
- ui
- image-rebuild

context:
- >-
  CHG-089 added return initiation, but returns were only reachable through an order. The Experience
  API already exposes the owner-scoped list at GET /v1/me/returns.
- >-
  The customer web had /returns/[id] but no index, and the primary navigation only linked Catalogue
  and Orders.

outcome: >-
  A signed-in customer opens Returns from the navigation and sees only their own return requests with
  honest status wording. Empty state points back to orders. No new API or schema.

decisions:
- id: DEC-091-01
  area: Data source
  proposed_default: >-
    Use GET /v1/me/returns with the HTTP-only session cookie. No client-side filtering of another
    owner's data is possible because the API scopes by session identity.
- id: DEC-091-02
  area: Presentation
  proposed_default: >-
    Reuse the existing return-row pattern and status vocabulary. Do not invent counts or promise
    refunds; point to the detail page for progress.
- id: DEC-091-03
  area: Scope
  proposed_default: >-
    UI only. No Experience API, schema, Admin or Seller change.

affected_capabilities:
- returns
- customer-post-purchase
affected_surfaces:
- customer-web.returns

requirements:
- id: R1
  name: Navigation and list
  outcome: Returns is reachable from the primary navigation and lists the signed-in customer's requests.
  status: pass
- id: R2
  name: Owner scope
  outcome: The list is produced by the owner-scoped API using the session cookie; no identifier is accepted from the browser.
  status: pass
- id: R3
  name: Honest wording
  outcome: Rows show status, reason, line count and request date; the page states a request is not a refund.
  status: pass
- id: R4
  name: Empty state
  outcome: With no returns, the page explains how to start one and links to orders.
  status: pass
- id: R5
  name: Verification
  outcome: Typecheck and production build pass; 390x844 and 1440x900 browser QC passes read-only.
  status: pass

