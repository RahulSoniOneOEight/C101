change_id: CHG-036
revision: 4
request: >-
  Define a best-practice operating model and phased implementation approach for the common Mercur
  administration console and its private Strapi CMS boundary. Improve operator navigation,
  content discovery, editing, preview, review, publication safety, delivery visibility, RBAC and
  auditability while preserving the existing commerce/content ownership split. Classify and
  sequence the remaining storefront-content delivery gaps without authorizing production release.
  Enforce one authoritative routine edit control for each property so the same
  value cannot be changed from competing admin or CMS controls.
type: admin-cms-operating-model-and-implementation-approach
extends:
- CHG-034
- CHG-035
affected_capabilities:
