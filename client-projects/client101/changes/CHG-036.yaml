proposed_decisions:
  D-036-01: mercur-admin-remains-the-routine-operator-interface-and-strapi-admin-remains-break-glass-only
  D-036-02: navigation-is-organised-by-operator-task-and-business-outcome-not-provider-or-database-model
  D-036-03: environment-channel-and-locale-context-remain-visible-throughout-editorial-workflows
  D-036-04: simple-records-use-native-data-table-detail-and-routed-drawer-patterns
  D-036-05: complex-layout-composition-uses-a-dedicated-governed-module-builder-not-routine-raw-json
  D-036-06: preview-validation-and-change-summary-precede-every-publish-or-scheduled-activation
  D-036-07: author-review-publish-and-administration-permissions-are-separated-and-enforced-server-side
  D-036-08: delivery-health-cache-freshness-and-last-successful-publication-are-visible-to-authorized-operators
  D-036-09: native-mercur-and-medusa-pages-are-extended-additively-and-not-forked-or-duplicated
  D-036-10: content-controls-use-medusa-ui-dashboard-shared-primitives-and-the-typed-sdk-only
  D-036-11: current-draft-modified-published-states-are-hardened-before-any-expanded-approval-workflow
  D-036-12: hero-layout-product-help-and-collection-delivery-gaps-are-closed-before-adding-personalization
  D-036-13: media-upload-remains-deferred-until-a-dam-and-asset-governance-decision-is-approved
  D-036-14: b2b-pricing-payments-and-production-release-remain-separate-governed-commerce-security-workstreams
  D-036-15: every-property-has-one-authoritative-routine-edit-control-and-all-other-surfaces-are-read-only-context-or-links
  D-036-16: a-governed-control-ownership-map-prevents-overlapping-editors-and-split-brain-property-values
required_tests:
- The routine operator can complete content tasks without seeing or authenticating to Strapi.
- Navigation distinguishes editorial presentation from commerce-owned products, taxonomy, offers,
  pricing, inventory, promotions, sellers, orders and finance.
- Every editorial list supports search, filters, pagination, locale context, channel context and
  publication-status visibility using native Mercur patterns.
- Closing an editor with unsaved changes warns the operator and never silently discards a draft.
- A stale write is rejected or explicitly reconciled instead of overwriting another operator's work.
- Publish presents validation results and a change summary and requires explicit confirmation.
- The preview represents the same Experience API projection and fallbacks used by the customer app.
- RBAC is enforced by the Medusa facade and private CMS boundary, not only by hidden UI controls.
- Each mutation remains idempotent, correlated and represented by an immutable audit record.
- CMS or projection failure is visible to operators while customer commerce remains available through
  the approved last-valid or governed fallback behavior.
- Product editorial, help content, curated membership and layout composition are not marked complete
  until an application consumer and acceptance evidence exist.
- No property is editable from more than one routine operator surface; contextual appearances resolve
  to the same authoritative editor or remain read-only.
- Layout references select an existing banner, collection, category or product identity and never
  duplicate the referenced entity's editable properties.
- Admin UI uses only Medusa UI tokens, public dashboard-shared primitives and the typed SDK.
- Keyboard, focus, labels, error association, status semantics and target sizes pass WCAG 2.2 AA checks.
constraints:
- Implementation authorization is limited to the bounded Phase 1 Mercur Admin UX refinement;
  later layout-builder, preview, media, targeting and production phases require separate review.
- No iframe and no direct browser-to-Strapi API call.
- No duplicate commerce write model in CMS.
- No price, inventory, seller terms, orders, payments, credit, commission or payout ownership in CMS.
- Strapi credentials, operator secrets and webhook signing material remain server-side.
- Media upload and DAM selection remain deferred.
- Staging only; production release remains unauthorized.
