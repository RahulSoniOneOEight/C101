change_id: CHG-080
revision: 2
status: staging-deployed-verified
request: >-
  Change Bought Together pairing from product-level to SKU-level. Operators
  search and select two SKUs in the admin; the pair is stored by variant, the
  admin list gains summary counters, both thumbnails, per-channel health and
  clearer labels, and the storefront shows the pair only on the paired SKU.
