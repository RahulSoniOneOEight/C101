requirements:
- id: R1
  name: Authority separation
  outcome: >-
    Contracts and runtime preserve Medusa/payment ownership of real refunds and Tryton ownership of
    stock; return projections never mutate either system.
  status: pass
- id: R2
  name: Versioned inspection
  outcome: >-
    Admin or the owning Seller records complete per-line inspection evidence after receipt with
    optimistic-version protection and immutable audit events.
  status: pass
- id: R3
  name: Seller isolation
  outcome: >-
    Cross-seller reads and writes return 404 without mutation; Seller decision, cancellation and
    refund attempts are denied.
  status: pass
- id: R4
  name: Explicit simulated refund
  outcome: >-
    Admin records one idempotent simulated refund projection only after inspection, with explicit
    amount/breakdown, simulation status/reference and zero real money effect.
  status: pass
- id: R5
  name: Customer visibility
  outcome: >-
    Flutter and secure customer web show inspection and simulated refund status only for the owning
    customer, including clear no-real-money wording.
  status: pass
- id: R6
  name: Admin and Seller workbenches
  outcome: >-
    Admin exposes full decision/refund controls; Seller exposes only scoped receipt/inspection
    controls. Both remain responsive, keyboard usable and consistent with registered return-status
    and workflow-action components.
  status: pass
- id: R7
  name: Event and notification evidence
  outcome: >-
    Inspection and refund-simulation events publish with dedupe/retry proof and create one owner
    notification each, all carrying test/simulation and zero-effect markers.
  status: pass
- id: R8
  name: Local acceptance and cleanup
  outcome: >-
    Isolated PostgreSQL/NATS HTTP and browser acceptance covers success, unauthorized access,
    cross-seller access, stale versions, duplicate replay, console errors and fixture cleanup.
  status: pass

