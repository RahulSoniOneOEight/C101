context:
- >-
  CHG-035 Phase 1 remains historically correct: it stopped at return decisions and prohibited
  refund and stock effects. CHG-087 extends that baseline for a new bounded staging increment; it
  does not rewrite or reinterpret prior evidence.
- >-
  The requester approved return-policy-2026-11-01 defaults for planning on 2026-10-28. That planning
  note is not legal/tax approval, production authorization, or permission for a real refund.
- >-
  CHG-017 already permits explicitly labelled simulated refund transitions as workflow evidence,
  distinct from financial refund evidence.

outcome: >-
  A customer-owned return can progress from Admin approval to Seller receipt and inspection, then
  to an Admin-recorded simulated refund projection visible to the customer. Every artifact is
  versioned, auditable and unmistakably test-only. Medusa payment/refund state and Tryton inventory
  remain unchanged.

decisions:
- id: DEC-087-01
  area: Canonical ownership
  proposed_default: >-
    Experience API owns only the staging return case, inspection evidence and simulated refund
    projection. Medusa/payment integration remains the authority for real payment and refund state;
    Tryton remains the authority for stock and warehouse movement. No canonical owner changes.
- id: DEC-087-02
  area: Role boundaries
  proposed_default: >-
    Admin may read all cases, approve/reject, record inspection when operationally required, and
    record the simulated refund projection. A Seller may read and inspect only returns containing
    lines from that Seller's allocation. A Seller cannot decide, cancel, refund, change payment
    state, or post inventory. Customers may read only their own case and notification state.
- id: DEC-087-03
  area: Inspection evidence
  proposed_default: >-
    Inspection records every approved line exactly once with received quantity, condition,
    disposition intent, note, actor and timestamp. Disposition is evidence only: restock, repair,
    quarantine or dispose never invokes Tryton and always carries stock_effect=none.
- id: DEC-087-04
  area: Simulated refund projection
  proposed_default: >-
    The projection uses statuses simulated_pending, simulated_completed or simulated_failed and an
    SIM-prefixed reference. It must never use a bare paid/completed status that can be mistaken for
    provider evidence. test_data=true, simulated=true and money_effect=none are mandatory.
- id: DEC-087-05
  area: Amount and method
  proposed_default: >-
    Admin supplies an explicit provisional amount and breakdown derived from the frozen policy
    snapshot. The service does not silently infer a final financial refund from item price alone.
    Supported labels are original_method_simulation and cod_bank_transfer_simulation. No bank
    details, PSP reference, tax credit note or settlement mutation is created.
- id: DEC-087-06
  area: Events and notifications
  proposed_default: >-
    Publish return.inspection-completed.v1 and return.refund-simulation-recorded.v1. Do not publish
    return.refund-paid. Customer copy must say simulated and must not claim that money or stock moved.
- id: DEC-087-07
  area: Customer web security
  proposed_default: >-
    Customer web post-purchase reads require an authenticated owner session or a separately approved
    signed lookup contract. Order or return identifiers alone never authorize access.
- id: DEC-087-08
  area: Provider boundary
  proposed_default: >-
    Carrier and reverse-pickup states remain manual simulated evidence. Shiprocket, PSP, accounting,
    settlement and inventory integrations remain deferred governed changes.

