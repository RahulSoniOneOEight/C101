required_tests:
- Contract validation passes with unique YAML keys and resolved AsyncAPI references.
- Unauthenticated Admin/Seller/customer calls fail closed.
- Customer A cannot read Customer B's order, return or refund simulation.
- Seller A cannot read or inspect Seller B's return; no event is written on denial.
- Seller cannot approve, reject, cancel or create a refund simulation.
- Inspection requires receipt, current version and every approved line exactly once.
- Invalid inspection and stale-version requests leave case, line and event counts unchanged.
- Refund simulation requires completed inspection, Admin permission, explicit amount/breakdown and an idempotency key.
- Duplicate refund simulation returns the original projection and emits one event/notification.
- Medusa payment/refund rows and Tryton stock/movement rows are unchanged.
- NATS publish/consume and duplicate/retry handling pass for both new subjects.
- Admin, Seller, Flutter and secure web views render at target widths with zero console/runtime errors.
- All local fixtures and temporary containers are removed after acceptance.

