gate_status:
  G0-governance: approved
  identity-implementation: approved
  notification-implementation: approved
  external-fcm-delivery: approved-staging-pilot
  hosted-deployment: deployed-staging-traefik
  apk-distribution: wave-1-distributed-pending-review
runtime_authorizations:
- scope: bounded-hosted-staging-only
  authorized:
  - configurable pilot allowlist and shared simulated OTP
  - Redis-backed pilot challenges and sessions
  - authenticated order and notification ownership enforcement
  - persistent notification inbox, read state, device registration and delivery records
  - four versioned notification templates and durable NATS notification worker
  - Flutter pilot authentication and notification client integration
  - hosted-staging packaging, configuration guards, tests and runbook preparation
  conditional_external_effects:
  - FCM delivery requires dedicated staging credentials, approved template wording and allowlisted tester devices.
  - Hosted deployment requires authorised hosting, DNS, TLS, secret storage, monitoring and backup inputs.
  - APK distribution requires protected signing material, hosted validation and approval of each rollout wave.
  prohibited:
  - production-payment
  - real-otp-or-sms
  - production-logistics
  - production-notifications
  - production-customer-data
  - production-release
production_release_authorized: false
fcm_enablement:
  approved_by: Rahul Soni
  approved_at_utc: '2026-10-08T19:24:13Z'
  template_wording_approved: true
  tester_consent_recorded: true
  server_credential_installed: true
  credential_location: /etc/buildkart/secrets/firebase-admin.json
  firebase_project: buildkart-staging
  templates:
  - key: product_launch_v1
