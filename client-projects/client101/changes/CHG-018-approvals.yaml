    description: Your BuildKart test order is confirmed. We will keep you posted.
  - key: delivery_update_v1
    heading: Delivery Status Update
    description: Your simulated shipment status changed. Open BuildKart to see details.
  artwork: staging-placeholder-pexels
  note: >-
    External FCM delivery is enabled for the bounded staging pilot only. Template headings are 3-4
    words with roughly 10-12 word descriptions and placeholder Pexels artwork. Production
    notifications remain prohibited. The credential is server-side and never committed.

