- Record one human-reviewed outcome per decision and required role; silence is not approval.
- Approved-with-amendment must identify the replacement baseline and the revision that incorporates it.
- Record the accountable human, authorised roles, UTC timestamp and exact Revision 1 hashes.
- Rejected or deferred decisions block hosted-pilot runtime implementation.
- Approval authorises bounded hosted-staging implementation only and cannot authorise production release.
- Never record secrets, signing material or tester identifiers in this ledger.
