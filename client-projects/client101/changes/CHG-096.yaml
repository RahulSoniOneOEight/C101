outcome: >-
  The Admin order-detail page shows a unified Payment/Delivery/Returns/Refund status strip,
  a coherent Payments card with authorized/captured/refunded/outstanding amounts, and a
  role-mode switch that previews the same order as Admin, Seller, App or Web. The page
  renders without overlap at 390x844 and preserves all existing native Medusa actions.

requirements:
- id: R1
  name: Status strip
  outcome: Replace the four mixed status tiles with a single Payment/Delivery/Returns/Refund strip.
  status: pass
- id: R2
  name: Payments card
  outcome: Show authorized/captured/refunded/outstanding amounts, payment method and reference, and native controls in one coherent card.
  status: pass
- id: R3
  name: Role-mode switch
  outcome: Add an Admin/Seller/App/Web segmented control that previews the same order group in each role context.
  status: pass
- id: R4
  name: Mobile layout
  outcome: 390x844 view has no blocking overlap, no document overflow, and readable line items.
  status: pass
- id: R5
  name: Native action parity
  outcome: Existing Capture payment, Update delivery status and Return workbench actions remain reachable.
  status: pass
- id: R6
  name: Accessibility
  outcome: Icon buttons have labels, product images have alt text, heading order is correct, and touch targets are at least 44x44 dp.
  status: pass
- id: R7
  name: Staging deploy and QC
  outcome: Deploy to staging, verify against order #151, and record evidence.
  status: pass

