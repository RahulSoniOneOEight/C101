required_inputs:
- Twenty tester email addresses or usernames supplied through an approved secret/configuration path.
- An authorised hosting target and deployment access.
- Domain and DNS access for staging HTTPS endpoints.
- A dedicated Firebase staging project and server-side FCM credentials.
- A protected Android release keystore and signing configuration.
- Final approved wording for the four notification templates.
required_tests:
- Only configured allowlisted identities can request a challenge; unknown identities receive 403.
- The shared pilot OTP is read from PILOT_OTP_CODE and remains 123456 only in bounded staging.
- OTP challenges and sessions survive an Experience API restart and work across replicas through Redis.
- Logout and revocation invalidate the session; expired challenges and sessions fail closed.
- Authenticated users can access only their own orders, notifications and device registrations.
- Launch and price-drop notifications target allowlisted testers only.
- Order-confirmed and delivery-update notifications target only the canonical order owner.
- Notification inbox and read state survive restart.
- Event processing and FCM delivery are idempotent, auditable, bounded-retry and dead-letter capable.
- Notification failure never changes canonical order success or another domain's state.
- All pilot orders, events, notifications and projections retain test_data=true.
- FCM credentials stay server-side and production Firebase projects are rejected by configuration guards.
- Hosted ingress is TLS-only and exposes only intended public routes.
- Backup and restore, logs, metrics and alert checks are evidenced on hosted staging.
- The non-debug signed APK resolves only staging HTTPS endpoints and contains no server credentials.
- Functional, ownership-isolation, restart, notification and bounded-load tests pass before distribution.
- Rollout is gated at 2-3 internal users, then 5 users, then all 20 after human review of each wave.
implementation_order:
- Configure pilot identities and PILOT_OTP_CODE.
- Persist OTP challenges and sessions in Redis.
- Propagate identity and enforce order ownership.
- Add notification, device-registration and delivery-attempt persistence.
- Add authenticated notification and device-token APIs.
- Add four versioned templates and required catalogue events.
- Add the durable NATS notification worker.
- Integrate only the dedicated staging FCM project.
- Wire Flutter authentication, notification inbox, badge, token refresh and deep links.
- Package and deploy the hosted staging services with TLS and secret references.
- Evidence backup, restore, logging, metrics and alerts.
- Build the staging-only release-signed APK.
- Validate and distribute in the approved rollout waves.
constraints:
- The pilot is limited to 20 explicitly allowlisted testers and synthetic/test data.
- PILOT_OTP_CODE is simulated and no SMS or production identity provider is enabled.
- Payment remains simulated; live payment credentials and production payment effects are prohibited.
- Logistics remains simulated; real carrier booking and production logistics effects are prohibited.
- FCM delivery uses a dedicated staging Firebase project and only allowlisted pilot devices.
- Production customer notifications and production notification credentials are prohibited.
- Every pilot effect and projection is marked test_data=true.
- Notification failure cannot block, reverse or manufacture canonical order success.
- Medusa, Mercur and Tryton ownership boundaries remain unchanged.
- NATS JetStream remains the cross-system event backbone; Redis/BullMQ remains Medusa-internal.
- Secrets, signing material and tester identities are never committed to Git or pasted into chat.
- A repository merge, signed APK or successful pilot wave does not authorise production release.
- Each rollout wave requires a recorded human review before expansion.
non_goals:
- production payment
- real SMS or OTP delivery
- real carrier booking or production logistics
- production customer data
- production notifications
- WhatsApp, email marketing or marketing automation
- production release
