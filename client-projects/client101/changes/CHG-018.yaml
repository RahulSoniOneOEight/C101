change_id: CHG-018
revision: 1
request: >-
  Extend the authorised local bounded-staging runtime into a hosted pilot for no more than
  20 explicitly allowlisted Android testers. The increment adds configurable pilot identities,
  a shared simulated OTP, Redis-backed sessions, per-user order and notification isolation,
  a persistent in-app notification inbox, bounded Firebase Cloud Messaging delivery from a
  dedicated staging project, production-shaped hosted services, TLS, secrets management,
  backup and restore evidence, Android release signing, and staged Firebase App Distribution.
  Payment, OTP, logistics and notification effects remain simulated or staging-only, and no
  production release or production customer effect is authorised.
type: architecture
