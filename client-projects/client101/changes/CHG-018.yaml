ownership:
  unchanged:
  - Commerce through Medusa owns carts and canonical orders.
  - Marketplace through Mercur owns sellers, offers and seller allocation.
  - ERP through Tryton owns inventory reservation, stock movement and accounting projections.
  hosted_pilot_additions:
  - The Experience API owns the staging-only pilot identity register and Redis-backed pilot sessions.
  - The Experience API owns the per-user notification inbox, read state and device-registration records.
  - FCM owns provider delivery evidence; the Experience API notification integration owns the normalised delivery-attempt record.
  - Notification projections never become canonical order, payment, allocation, inventory or shipment state.
