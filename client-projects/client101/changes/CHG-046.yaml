change_id: CHG-046
revision: 1
status: proposed-awaiting-approval
production_release_authorized: false
request: >-
  Every collection an operator creates must have a customer-facing URL that opens that collection's
  products. A collection shared with a customer, linked from a banner or used as a See All destination
  must resolve to its own products, and an unknown or empty collection must say so rather than showing
  unrelated products.
type: customer-facing-collection-url
extends:
- CHG-045
affected_capabilities:
- marketplace-merchandising
- storefront-experience
affected_domains:
- commerce
- experience
affected_surfaces:
- experience-api.content.collections
- app.prototype.collection
- app.prototype.banner-action
inspection: services/experience-api/src/collections/resolver.ts
already_present:
- '`GET /v1/collections/{key}` resolves dynamic collections from a hardcoded key registry (new arrivals, best sellers, recently viewed, merchandising keys).'
- '`listProductsByCollection(collectionId)` resolves commerce membership for layout sections (CHG-044 phase 3a).'
- Banners and editorial action URIs already point at `/collections/<key>` paths.
missing:
- A route in the customer app. `/collections/<key>` is not registered, so every banner pointing at a collection is a dead link.
- Delivery resolution for collections that are not in the key registry. An unknown key currently falls back to new arrivals, so a link to a real but unregistered collection shows unrelated products.
- Any not-found semantics. An unknown or empty collection looks identical to a working one.
- A way for an operator to obtain the customer URL for a collection they created.
conflicts_requiring_a_decision:
- C-046-01: 'The key registry and commerce collections are two different addressing schemes for the same idea. Resolution order has to be stated, or a registry key and a collection handle could disagree.'
- C-046-02: 'Collections are channel-neutral in commerce but the storefront is split b2c/b2b. The contract must say whether one URL serves both channels or each channel gets its own surface.'
decisions_proposed:
- D-046-01: 'Address a collection by its commerce handle. A handle is stable, human-readable, created with the collection, and already unique in Medusa; inventing a second identifier would need a mapping that can drift.'
- D-046-02: 'Registry keys keep precedence. They are curated, sometimes computed (recently viewed), and existing links depend on them; a commerce collection may not shadow a registry key.'
- D-046-03: 'An unknown key returns 404 with a clear code, never a fallback product list. Silently serving new arrivals for a broken link is the kind of quiet substitution this programme has removed elsewhere.'
- D-046-04: 'A collection that exists but has no deliverable products returns 404 with a distinct reason, so an operator can tell "wrong link" from "nothing published yet".'
- D-046-05: 'A known registry key that is deliberately deferred keeps its current fallback behaviour; only unknown keys become 404. This change must not alter existing dynamic collections.'
- D-046-06: 'The URL is channel-neutral and serves the products the storefront can deliver in the requesting channel; b2b pricing is handled at read time, not by a separate URL.'
proposed_phases:
  phase_1_delivery:
  - Resolve an unregistered key as a commerce collection handle, returning the collection title, handle, id and its deliverable products.
  - Return 404 for an unknown handle and a distinct 404 for an empty collection; leave deferred registry keys falling back as they do today.
  - Contract tests for registry precedence, commerce resolution, unknown key, empty collection and channel isolation.
  phase_2_customer_route:
  - Add a `/collections/<handle>` route that renders the collection title and its products, with a real not-found state.
  - Make banner and See All links to collection paths open it.
  phase_3_operator_visibility:
  - Show the customer URL for each collection in the console so an operator can copy and use it.
  phase_4_release:
  - Release delivery and app to staging; verify one operator-created collection end to end and one unknown handle as a 404.
required_tests:
- A collection created in the console opens by handle and shows its own products.
- A registry key still resolves exactly as before, including a deferred key that falls back.
- An unknown handle returns 404 and no products.
- An existing collection with no deliverable products returns the empty-specific 404, not a generic one.
- A collection handle that collides with a registry key resolves to the registry key.
- A banner action pointing at a collection path reaches that collection.
- No endpoint returns another collection's products as a fallback for a bad link.
- Public collection responses expose no draft or unpublished products.
constraints:
- Reuse the existing collections delivery endpoint and product model; do not add a parallel collection API.
- Commerce remains authoritative for collection membership; editorial holds no product list.
- No fabricated ordering: with no manual order (CHG-045), delivery keeps its existing order.
- Staging only; production release remains unauthorized.
approval_required: true
implementation_request:
  requested_by: human-requester
  requested_at_utc: '2026-10-17'
  scope: customer-facing-collection-url
  human_approval_required_before_code: true
