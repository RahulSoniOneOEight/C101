context:
- >-
  The return contract already accepts evidence metadata (object key, content type, size, sha256) and
  the store persists `pilot_return_evidence`, but nothing could upload a file and no surface rendered
  evidence. The Admin inspection step therefore had no customer photos to review.
- >-
  No object-storage credential exists for this project, so the staging pilot uses a local Docker
  volume behind a small store interface. Production must use S3-compatible storage plus scanning.

outcome: >-
  A customer can attach up to three JPEG/PNG/WebP photos (5 MB each) to a return request. Files are
  stored outside any web root, served only through ten-minute HMAC-signed URLs, and rendered on the
  customer return page and the Admin/Seller return workbenches. No refund, stock or provider call is
  added.

decisions:
- id: DEC-092-01
  area: Storage
  proposed_default: >-
    Local disk under a Docker volume (`EVIDENCE_DIR=/var/lib/buildkart/evidence`) for staging. The
    store is a single class; S3 can replace it without changing the API contract.
- id: DEC-092-02
  area: Accepted files
  proposed_default: >-
    JPEG, PNG and WebP only; 1 byte to 5 MB; max three per request. No SVG, PDF, archive or video.
- id: DEC-092-03
  area: Access
  proposed_default: >-
    Upload is owner-scoped. Reads use a ten-minute HMAC-signed URL that carries no owner identity or
    object key; expired or tampered links are rejected.
- id: DEC-092-04
  area: Inspection role
  proposed_default: >-
    Photos are evidence only. Admin and the allocated Seller can view them; they cannot change money
    or stock.
- id: DEC-092-05
  area: Malware scanning
  proposed_default: >-
    Not implemented. Files are image-only, served with `nosniff` and a sandbox CSP, and never
    executed. `scan_status` stays `pending` and is disclosed. Production requires scanning.

