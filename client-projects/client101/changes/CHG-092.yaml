requirements:
- id: R1
  name: Owner-scoped upload
  outcome: A signed-in owner uploads an image for their own order; other orders are rejected.
  status: pass
- id: R2
  name: File policy
  outcome: Non-image types, empty files and files over 5 MB are rejected with readable errors.
  status: pass
- id: R3
  name: Private storage
  outcome: The object key never appears in a URL; files live outside any web root and are not listed.
  status: pass
- id: R4
  name: Signed read
  outcome: A valid signature serves the image; expired, tampered or unknown IDs are rejected.
  status: pass
- id: R5
  name: Surface display
  outcome: Customer, Admin and Seller see the attached photos with size/type; Admin and Seller cards state evidence only.
  status: pass
- id: R6
  name: No provider effect
  outcome: No Medusa refund, Tryton stock, carrier or settlement call is added.
  status: pass
- id: R7
  name: Verification
  outcome: Typechecks and builds pass; store and signing behaviour is tested; staging upload/read QC is separately gated.
  status: pass

