adr_id: ADR-client101-013
title: Cart assistant as a governed participant
status: accepted
decision_scope: phase-c-deterministic-read-only-implementation
date_utc: '2026-10-21'
change: CHG-073
supersedes: null
context: >-
  CHG-072 introduced a conversation dock with human owners and participants. The next request is a
  cart assistant that can be mentioned or messaged separately from the human conversation. That
  introduces a new actor type, a new channel/thread model, model-provider data handling and a
  potential cart-building capability that is currently gated behind Phase E.
decision: >-
  Model the assistant as a distinct, non-human actor in the Workspace bounded context. It is
  mentionable in the project channel and has a separate assistant thread. The first implementation
  is a deterministic, on-platform assistant with a governed human-escalation path. It is read-only:
  it may summarise the accepted shared list, report pending proposals, explain the cart handoff and
  flag missing quantities or MOQ. It may not decide proposals, approve revisions, invite members,
  check out, read owner-only address/payment/GST fields, or write to commerce. It has no external
  model-provider call in this phase. Any future cart preparation remains a suggestion. The owner,
  buyer or account admin must still perform the explicit cart build under CHG-072 Phase E, after
  revalidation, difference acknowledgement and the existing idempotent handoff.
assistant_actor:
  kind: automated
  display_name: BuildKart Cart Assistant
  visibly_non_human: true
  identity: workspace-scoped assistant principal, never a human user id
  escalation: human operations specialist joins the same thread with a distinct support role
channels:
  mention: '@assistant in the project or procurement channel'
  direct_thread: one assistant channel per workspace, visible to every active member
  isolation: assistant messages enter the human thread only when explicitly mentioned; the direct thread is separate
permissions:
  allowed:
  - read the caller's prompt and the accepted shared-list projection in the same workspace
  - read the current revision totals, line count and pending-proposal count
  - summarise, flag missing quantities/MOQ/seller information and explain the handoff
  - request human escalation
  forbidden:
  - read unrelated human messages or owner-only records
  - read owner-only address, phone, GST, payment or checkout data
  - accept or reject proposals
  - approve or request changes to a revision
  - invite or revoke participants
  - build a cart, complete checkout or create an order
  - change membership, roles or scope
  - call arbitrary tools or databases outside an allowlist
privacy:
  data_minimisation: read only aggregate list fields and product titles/quantities; no owner-only fields
  redaction: owner-only address, phone, GST, payment and checkout data are never queried
  provider: none in Phase C; deterministic rules run inside the Workspace service
  provider_training: not applicable until a provider is approved
  retention: assistant messages follow the existing workspace message retention in the Workspace database
  audit: every assistant message and the triggering actor/message are written to activity_event
prompt_injection:
  product_content: deterministic rules never execute product text as instructions
  tool_allowlist: no model tools; only fixed read queries over the workspace projection
  cart_write: impossible; the assistant has no cart or commerce client
  escalation: policy-sensitive requests receive a human-escalation instruction, not an action
escalation:
  trigger: user asks for a human, the assistant cannot resolve the request, or a policy-sensitive action is requested
  human_role: support specialist with audited, redacted project access
  continuity: the human joins the same thread; the assistant does not impersonate the human
  fallback: the human conversation remains fully usable if the assistant is unavailable
phase_e_boundary:
  current: read-only summaries and handoff explanations only
  handoff: the human owner/buyer opens Review before cart build under CHG-072 Phase E
  assistant_write: none; the assistant cannot prepare or execute a cart write in Phase C
  required_controls:
  - revalidate price, stock, MOQ and seller
  - show differences and require acknowledgement
  - idempotent handoff per accepted revision
  - no order completion from chat
consequences:
- The assistant is a new workspace actor represented by a separate assistant channel, not a human member.
- No conversation content leaves the platform in Phase C.
- The assistant cannot be used to bypass owner, buyer or approver rules.
- A future model-backed assistant requires a new provider, residency and retention decision.
implementation:
  release: 0d7d884
  frontend: 0d7d884
  backend: workspace service creates/ensures an assistant channel and answers deterministically
  app: dock exposes an Assistant tab, @assistant mention action and visibly automated message styling
  smoke: household smoke asserts a direct assistant reply and a mention reply
  staging_status: verified
open_questions:
- Does the human escalation path use an existing support queue or a dedicated ops role?
- Should assistant unread replies contribute to the global conversation badge, or be shown separately?
- What is the fallback when the assistant is unavailable or rate-limited?

