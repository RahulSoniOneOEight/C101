decision_id: ADR-client101-011
client_id: client101
title: Add Workspace as a bounded context for collaboration and purchase intent
status: proposed
context: >-
  B2B buyers currently discuss requirements in local chat fixtures and edit fixture carts. There is
  no durable, tenant-scoped record of who proposed a change, which exact revision was approved, or
  whether the approved commercial payload is still valid. Putting chat, approvals and draft state
  into Medusa would duplicate commerce ownership; letting clients call Medusa, Mercur and Tryton
  directly would bypass composition and authorization.
decision: >-
  Introduce a Workspace bounded context with its own database and service. Workspace owns
  workspaces, membership projections, channels, messages, product-share references, purchase drafts,
  immutable revisions, proposals, approval evidence, activity events, checkout-handoff records and a
  transactional outbox. Clients interact only through the Experience API. Revalidation and
  materialisation call Commerce orchestration; Workspace never calls Medusa, Mercur or Tryton
  directly. Commerce remains authoritative for business accounts, carts, checkouts, payments and
  orders; Mercur for sellers/offers; Tryton for inventory/reservations.
alternatives:
- Reuse the existing local chat/approval fixtures (rejected: no durable revision, tenant or approval evidence).
- Store collaboration state in Medusa or Mercur (rejected: duplicates commerce ownership and couples chat to checkout).
- Operate Matrix/Synapse for Pilot 1 text chat (rejected: operational cost and no pilot need for federation, presence or attachments).
- Let clients call each backend directly (rejected: ungoverned joins, credential exposure and unenforceable authorization).
- Put purchase drafts into the cart (rejected: chat/draft mutations must not silently change commercial state).
consequences:
- One new runtime, database, migration set, health endpoint and secret boundary.
- Approval can be reconstructed exactly from an immutable revision and commercial hash.
- Commerce checkout remains the only path to an order; Workspace only requests a handoff.
- Realtime uses a custom Postgres/REST/WebSocket transport behind a ConversationTransport interface.
- Experience API grows a workspace composition/proxy surface and notification projection.
- Tenant isolation, RLS, idempotency and append-only activity become release-blocking tests.
- B2C household collaboration, seller messaging, attachments and Matrix remain deferred.
affected_capabilities:
