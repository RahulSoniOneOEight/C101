- truth_id: TRUTH-0006
  path: constraints
  value:
  - Greenfield implementation; no current commerce, ERP/accounting, inventory/WMS
    or support systems identified
  - Phase 1 scope is B2C + B2B + seller experience together, including Commerce Operations/Admin
    UX and ERP/Accounting UX
  - Mobile-first and data-light
  - UPI, COD and assisted/WhatsApp commerce emphasized
  - Vernacular/localized UX direction
  - Mixed catalogue/inventory/fulfilment ownership model
  - 10 sellers at launch, approximately 30 SKUs per seller
  - Referral is included in Phase 1
  - Loyalty/rewards and personalisation are NOT confirmed for Phase 1
  - Multi-seller offers; backend splits orders by seller/warehouse/fulfilment location
  - Seller-specific return conditions/policies must be visible
  - Marketplace finance separates seller payable, commission, gateway/logistics/promotion
    adjustments and refund liability
  - GST/business documents required for B2B flows
  - Exact launch geography, order volumes, timeline, budget and performance targets
    remain TBD
  - Technology implementation (Flutter/web/backend stack) is not treated as client-confirmed
  classification: fact
  confidence: 1.0
  sources: *id001
  status: confirmed
  notes: []
