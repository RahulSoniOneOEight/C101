- truth_id: TRUTH-0009
  path: experience_requirements
  value:
  - requirement_id: REQ-cart-merchandising
    statement: Show related/complementary products based on products already in the
      cart before checkout completion, with quick-add where appropriate. Recommendation
      logic must remain configurable rather than hard-coded into the UI.
    ux_impact: true
    source_refs:
    - SRC-001
    - SRC-002
    requested_surfaces:
    - customer-app
    - web-store
    - b2b
    requested_screens:
    - cart
    - checkout
    requested_components:
    - related-products-rail
    - product-card
    - cart-line
    - quick-add
    required_states:
    - default
    - empty
    - loading
  - requirement_id: REQ-external-price-comparison
    statement: Product tiles/PDP may show comparable observed Amazon/Flipkart prices,
      clearly distinguished from own selling price. Competitor-price records must
      retain source marketplace, observed price and observation/freshness timestamp
      so stale or unavailable external prices are handled safely.
    ux_impact: true
    source_refs:
    - SRC-001
    requested_surfaces:
    - customer-app
    - web-store
    - b2b
    requested_screens:
    - product-list
    - product-detail
    requested_components:
    - product-card
    - price-comparison
    - competitor-price
    required_states:
    - default
    - stale-price
    - unavailable
  - requirement_id: REQ-project-site-purchasing
    statement: A B2B account can manage multiple projects/sites and delivery locations,
      build project-specific material lists/carts/orders, and deliver orders to the
      appropriate project/location. Project/Site is a first-class business context
      (name, delivery location, material lists, RFQs/orders, purchasing history),
      not merely a saved address.
    ux_impact: true
    source_refs:
    - SRC-002
    requested_surfaces:
    - b2b
    requested_screens:
    - project-list
    - project-detail
    - material-list
    requested_components:
    - project-card
    - project-selector
    - material-list
    required_states:
    - default
    - empty
    - loading
  - requirement_id: REQ-project-site-reorder
    statement: A B2B account can view project/site-level purchasing history and conveniently
      reorder from previous project orders or material lists.
    ux_impact: true
    source_refs:
    - SRC-002
    requested_surfaces:
    - b2b
    requested_screens:
    - project-detail
    - order-history
    requested_components:
    - project-card
    - reorder-action
    required_states:
    - default
    - empty
    - loading
  - requirement_id: REQ-competitor-price-data
    statement: Amazon/Flipkart observed prices are external inputs supplied by a crawler/price-intelligence
      process; UX consumes normalized competitor-price data (marketplace, observed
      price, freshness timestamp).
    ux_impact: false
    source_refs:
    - SRC-001
  - requirement_id: REQ-configurable-recommendations
    statement: Cart/checkout recommendation logic must remain configurable rather
      than hard-coded into the UI.
    ux_impact: false
    source_refs:
    - SRC-001
  classification: fact
  confidence: 1.0
  sources: *id001
