openapi: 3.1.0
info:
  title: BuildKart Merchandising Presets Staging API
  version: 0.1.0-draft
  description: >-
    Read-only operator contract for the CHG-029 bounded-staging merchandising preset pack:
    curated collections, marketplace-funded promotions evaluated by the real Medusa discount
    engine, campaigns that group those promotions, and editorial campaign elements. Medusa owns
    promotions and campaigns; Mercur owns curated collections; the CMS or governed editorial
    source owns campaign copy. The contract cannot execute a discount and is prohibited in
    production. No preset record may declare a seller funding source.
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://ops-staging.pinakaplay.cloud
  description: Bounded hosted staging operator surface
tags:
- name: Merchandising
  description: Read-only staging preset catalogue; never transactional eligibility.
security:
- bearerAuth: []
paths:
  /admin/buildkart/merchandising-presets:
    get:
      operationId: listMerchandisingPresets
      summary: List the bounded-staging merchandising preset catalogue
      tags: [Merchandising]
      responses:
        '200':
          description: Read-only staging preset catalogue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MerchandisingPresetCatalogue'}
        '401': {description: Missing or invalid operator authentication}
        '404': {description: Route is unavailable outside bounded staging}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MerchandisingCollectionPreset:
      type: object
      required: [collection_key, title, type, categories, enabled, status, test_data]
      properties:
        collection_key: {type: string}
        title: {type: string}
        type: {type: string, enum: [manual, dynamic]}
        categories:
          type: array
          minItems: 1
          items: {type: string}
        enabled: {type: boolean}
        status: {type: string, enum: [enabled, disabled, deferred]}
        test_data: {type: boolean, const: true}
    MerchandisingPromotionTarget:
      type: object
      required: [type, reference]
      properties:
        type:
          type: string
          enum: [category, collection, product, product_type, seller, shipping_methods]
        reference: {type: string}
        customer_group: {type: string}
    DeferredCondition:
      type: object
      required: [condition, value, reason]
      properties:
        condition: {type: string}
        value: {type: string}
        reason: {type: string}
    MerchandisingPromotionPreset:
      type: object
      required:
      - code
      - campaign_key
      - application_method
      - value
      - target
      - automatic
      - starts_at
      - ends_at
      - usage_limit
      - funding_source
      - policy_pending
      - test_data
      - deferred_conditions
      properties:
        code: {type: string}
        campaign_key: {type: string}
        application_method: {type: string, enum: [percentage, fixed, free_shipping]}
        value: {type: number, minimum: 0, maximum: 10}
        target: {$ref: '#/components/schemas/MerchandisingPromotionTarget'}
        automatic: {type: boolean}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        usage_limit: {type: integer, minimum: 1}
        funding_source: {type: string, const: marketplace}
        policy_pending: {type: boolean, const: true}
        test_data: {type: boolean, const: true}
        deferred_conditions:
          type: array
          description: >-
            Conditions intended by policy but not enforceable by the Medusa promotion engine.
            They are recorded for review and must not be assumed to be enforced.
          items: {$ref: '#/components/schemas/DeferredCondition'}
    MerchandisingCampaignPreset:
      type: object
      required:
      - campaign_key
      - title
      - promotion_codes
      - budget_amount_minor
      - currency_code
      - starts_at
      - ends_at
      - funding_source
      - policy_pending
      - test_data
      properties:
        campaign_key: {type: string}
        title: {type: string}
        promotion_codes:
          type: array
          minItems: 1
          items: {type: string}
        budget_amount_minor: {type: integer, minimum: 0}
        currency_code: {type: string, const: inr}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        funding_source: {type: string, const: marketplace}
        policy_pending: {type: boolean, const: true}
        test_data: {type: boolean, const: true}
    MerchandisingContentElement:
      type: object
      required:
      - id
      - content_type
      - placement
      - locale
      - title
      - body
      - version
      - campaign_key
      - test_data
      properties:
        id: {type: string}
        content_type:
          type: string
          enum: [banner, onboarding, help, faq, campaign-copy, legal-link]
        placement: {type: string}
        locale: {type: string, enum: [en-IN, hi-IN]}
        title: {type: string}
        body: {type: string}
        action_label: {type: [string, 'null']}
        action_uri: {type: [string, 'null']}
        version: {type: string}
        campaign_key: {type: string}
        test_data: {type: boolean, const: true}
    MerchandisingPresetCatalogue:
      type: object
      required:
      - change_id
      - environment
      - generated_at
      - funding_source
      - discount_ceiling_percent
      - test_data
      - payment_mode
      - collections
      - promotions
      - campaigns
      - content
      properties:
        change_id: {type: string, const: CHG-029}
        environment: {type: string, const: staging}
        generated_at: {type: string, format: date-time}
        funding_source: {type: string, const: marketplace}
        discount_ceiling_percent: {type: number, const: 10}
        test_data: {type: boolean, const: true}
        payment_mode: {type: string, const: simulated}
        collections:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MerchandisingCollectionPreset'}
        promotions:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MerchandisingPromotionPreset'}
        campaigns:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MerchandisingCampaignPreset'}
        content:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MerchandisingContentElement'}
