- id: E-017-003
  title: Payment provider prepaid and refund capability
  decisions: [D-017-10, D-017-20, D-017-21]
  required_roles: [finance, security, integration-owners]
  status: planned
  disposition: deferred-for-staging-increment
  candidate: Razorpay REST API v1
  blocking_scopes: [provider-payment-g3, production-prepaid-checkout]
  non_blocking_scopes: [staging-g0]
  owner: RS
  evidence_refs: []
  acceptance_criteria:
  - Provider, exact version/API version and prepaid method are recorded.
  - Signed webhook, authenticated query, capture and idempotent refund are demonstrated.
  - Duplicate, out-of-order and ambiguous outcomes are reconciled without duplicate charge.
- id: E-017-004
  title: Logistics provider sandbox capability
  decisions: [D-017-11, D-017-21]
  required_roles: [logistics, operations, security, integration-owners]
  status: missing
  disposition: deferred-for-pilot
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Pilot uses simulated logistics (serviceability/shipment/tracking); production logistics provider deferred (Shiprocket candidate, Delhivery fallback).
  acceptance_criteria:
  - Provider, API version, sandbox geography and owner are recorded.
  - Serviceability, rate, booking, lookup and tracking are demonstrated.
  - Ambiguous booking and unsupported physical split behavior are demonstrated.
- id: E-017-005
  title: Queue, storage and notification dependencies
  decisions: [D-017-15, D-017-21]
  required_roles: [architecture, security, integration-owners, operations]
  status: planned
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Approved architecture — NATS JetStream (canonical cross-domain event backbone), Valkey/Redis (cache/locks), Cloudflare R2 (object storage), FCM push. Exact versions/tiers/owners still to be recorded.
  acceptance_criteria:
  - Queue or broker, object storage and notification dependencies are selected or excluded.
  - Exact versions/service tiers, owners and retention/security constraints are recorded.
- id: E-017-006
  title: Environment topology and ownership
  decisions: [D-017-21, D-017-23]
  required_roles: [architecture, security, operations, integration-owners]
  status: in-progress
  disposition: accepted-with-conditions
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Staging topology defined (local Postgres/Redis/Tryton/Medusa/Experience API, isolated ports); environment delegate named (RS). Production environment topology/ownership is deferred to a production deployment.
  acceptance_criteria:
  - Development, CI, integration, staging and production-readiness owners are named.
  - Isolation, access and deployment boundaries are documented.
- id: E-017-007
  title: Secrets, observability and on-call ownership
  decisions: [D-017-14, D-017-21, D-017-23]
  required_roles: [security, operations, integration-owners]
  status: in-progress
  disposition: accepted-with-conditions
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md, client-projects/client101/evidence/CHG-017/load-profile-resources.md, client-projects/client101/evidence/CHG-017/event-consumers-operations.md, docs/architecture/backend-staging-runbook.md]
  note: Staging observability in place — structured JSON logs, /health checks, durable domain-event log, correlation ids, a Prometheus-style /metrics endpoint (process/pool/cache/NATS-lag), an nginx reverse proxy, and continuously running event workers exposing per-consumer lag/dead-letter counters; delegates named (RS). Production OTel traces, central logs and secret-manager mechanism are deferred to a production deployment.
  acceptance_criteria:
  - Secret manager, access, rotation and break-glass ownership are documented.
  - Logs, metrics, traces, alerts, escalation and on-call ownership are documented.
- id: E-017-008
  title: Peak load and transaction profile
  decisions: [D-017-23]
  required_roles: [architecture, operations, release-authority]
  status: accepted
  disposition: accepted
  owner: RS
  evidence_refs: [services/experience-api/src/scripts/load-test.ts, services/experience-api/src/medusa/store-client.ts, services/experience-api/src/index.ts, client-projects/client101/evidence/CHG-017/load-profile-resources.md, docs/architecture/backend-staging-runbook.md]
  note: Load target met via N+1 fix (bulk offers), read-model offer cache (30s TTL, keyed by product IDs + region/country/currency), and production-shaped Medusa. Comparison at 50 virtual users / 20s — error rate 55% to 0%, p95 ~22s to 630ms, throughput ~7 rps to 128 rps, p50 416ms / p99 705ms. Re-measured through the nginx reverse proxy at 50 users / 15s — 93 rps, 0.99% errors, p95 527ms, cache hit ratio 96.9%, CPU <8%, RSS <100MB, no pool waiting, NATS lag 0. Browse may use short-lived cached commercial data; transaction creation (cart/order/reservation) revalidates against canonical Medusa/Tryton services — concurrency and expiry tests pass.
  acceptance_criteria:
  - Peak request rate, concurrent checkout attempts and transaction mix are approved.
  - Representative seller, SKU, order and dependency-latency assumptions are recorded.
- id: E-017-009
  title: Recovery objectives and restore-proof plan
  decisions: [D-017-23]
  required_roles: [architecture, operations, release-authority]
  status: accepted
  disposition: accepted-for-bounded-pilot
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md, client-projects/client101/evidence/CHG-017/load-profile-resources.md]
  note: Targets approved (PS-10) — backup daily, RPO <=24h, RTO <=4h, restore test monthly. Backup/restore drill evidenced — pg_dump (Fc) of buildkart + buildkart_experience, restored to a throwaway DB, 52 products verified. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06; production backup ownership/retention documentation remains for a production deployment.
  acceptance_criteria:
  - RPO and RTO are approved.
  - Backup ownership, retention and restore-proof stage are documented.
- id: E-017-010
  title: Membership and access rules
  decisions: [D-017-03, D-017-14]
  required_roles: [product, security, architecture, operations]
  status: planned
  disposition: accepted-for-bounded-pilot
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Membership/access policy approved for the bounded pilot (PS-13) — allowlist-only, simulated OTP, backend-controlled B2B membership and roles (account_admin, buyer, approver, finance), account isolation, least privilege, fail-closed revocation, logout invalidation, auditable changes. Implementation evidence still pending.
  acceptance_criteria:
  - Buyer, business-account, seller and operator membership rules are documented.
  - Tenant and seller isolation plus action-level permissions are testable.
- id: E-017-011
  title: Tax and invoice policy
  decisions: [D-017-01, D-017-12]
  required_roles: [finance-tax, legal, erp-operations]
  status: planned
  disposition: accepted
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: GST/invoice policy approved (PS-11) — all customer-facing prices GST-inclusive for B2C and B2B across app/web; taxable value + CGST/SGST/IGST breakup shown separately but headline price GST-inclusive; frontend never computes GST; supplier-issued immutable invoices; credit/debit notes for corrections. Implementation evidence still pending.
  acceptance_criteria:
  - Tax calculation owner, basis, jurisdiction and line/order rounding are documented.
  - Invoice issuer, trigger/timing, numbering and correction policy are documented.
  - Accepted tax snapshots and invoice-result reconciliation are defined.
- id: E-017-012
  title: Accounting projection policy
  decisions: [D-017-01, D-017-19]
  required_roles: [finance-tax, erp-operations]
  status: planned
  disposition: accepted-for-pilot
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Accounting-posting policy approved for the bounded pilot (PS-12) — no posting from non-financial intent states; canonical triggers only (order, payment, invoice, fulfilment, cancellation, return, refund, commission, settlement, reversal); test-clearing/staging accounts only; no production books or statutory filing; Tryton is the staging accounting target.
  acceptance_criteria:
  - Posting triggers, entry writer and account mappings are documented.
  - Reversal and reconciliation ownership are documented.
  - Order placement is not treated as automatic revenue recognition.
- id: E-017-013
  title: Tryton reservation concurrency and recovery
  decisions: [D-017-08, D-017-17]
  required_roles: [architecture, erp-operations, finance]
  status: accepted
  candidate: Tryton 8.0 series; exact server, module and PostgreSQL patch versions pending compatibility testing
  owner: RS
  evidence_refs: [services/experience-api/src/scripts/concurrency-test.ts, services/experience-api/src/scripts/expiry-test.ts, services/experience-api/src/store/reservation-store.ts]
  note: All four criteria evidenced — idempotent re-reserve (per-checkout record), atomic no-oversell (Postgres conditional UPDATE; 10 concurrent reserves vs available=5 yield exactly 5 success + 5 409), expiry vs commit competing transition (expired reservation cannot commit, 409 reservation-expired), and late-payment re-reserve after expiry. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06.
  acceptance_criteria:
  - Reserve, commit, release and expiry operations use stable idempotency keys.
  - Commitment and expiry are demonstrated as atomic competing transitions.
  - Concurrent checkout cannot oversell constrained inventory.
  - Late payment obtains a fresh reservation or enters durable refund recovery.
- id: E-017-014
  title: Staging simulated-payment adapter safety and behavior
  decisions: [D-017-10, D-017-17, D-017-20, D-017-23]
  required_roles: [product, architecture, security, finance, operations, release-authority]
  status: evidenced
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/payment-simulation-acceptance.md
  - services/backend/packages/api/src/modules/simulated-payment/service.ts
  - services/backend/packages/api/src/config/payment-runtime.ts
  - services/experience-api/src/scripts/payment-flow-test.ts
  - services/experience-api/src/scripts/payment-outcome-matrix-test.ts
  note: Success-path canonical checkout (including a committed Tryton reservation and reconciliation), server-selected adapter, idempotent outcomes, test markers, no-PSP boundary and production fail-closed behavior are evidenced. The failure/pending/duplicate/late/refund matrix is covered by test:payment-matrix, including non-financial refund evidence and no-fallback-on-failure. All acceptance criteria are evidenced; final acceptance remains with the accountable roles.
  acceptance_criteria:
  - Server-selected simulator supports success, failure, pending, duplicate and late results.
  - Staging test orders require canonical order, confirmed allocation, committed reservation and simulated acceptance.
  - Simulated refund transitions remain visibly non-financial test evidence.
  - Clients cannot select adapter mode or manufacture success.
  - Production fails startup or disables checkout when simulation is configured.
  - Provider failure cannot fall back to simulation.
- id: E-017-015
  title: Functional Medusa staging Commerce integration
  decisions: [D-017-01, D-017-02, D-017-17]
  required_roles: [architecture, product, operations]
  status: accepted
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/payment-simulation-acceptance.md
  - services/experience-api/src/scripts/payment-flow-test.ts
  - services/experience-api/src/store/correlation-store.ts
  - services/experience-api/src/store/event-store.ts
  note: Canonical cart/order-group/seller-order persistence, test-only metadata and retry convergence to one order group/payment session/order.confirmed event are verified. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06.
  acceptance_criteria:
  - Medusa persists staging cart, checkout reference and canonical test order.
  - Idempotent recovery returns the same order after timeout or duplicate completion.
  - Test and simulated-payment markers persist on the canonical order.
- id: E-017-016
  title: Functional Mercur staging Marketplace integration
  decisions: [D-017-01, D-017-04, D-017-05, D-017-06, D-017-17]
  required_roles: [architecture, marketplace, marketplace-operations]
  status: accepted
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/payment-simulation-acceptance.md
  - services/experience-api/src/scripts/payment-flow-test.ts
  - client-projects/client101/evidence/CHG-017/event-consumers-operations.md
  note: Acceptance queries verify the selected offer and seller are preserved in Mercur's persisted order links without silent substitution; commerce.order.created.v1 is delivered to the continuous mercur-allocation consumer. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06.
  acceptance_criteria:
  - Mercur supplies actual staging sellers, offers and eligibility.
  - Selected seller is not silently substituted.
  - Allocation is persisted and confirmed against the Medusa test order.
- id: E-017-017
  title: Functional Tryton staging movement and accounting integration
  decisions: [D-017-01, D-017-08, D-017-19]
  required_roles: [architecture, erp-operations, finance-tax]
  status: accepted
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/payment-simulation-acceptance.md
  - client-projects/client101/evidence/CHG-017/erp-reconciliation-connectivity.md
  - services/experience-api/src/scripts/payment-flow-test.ts
  - services/experience-api/src/scripts/erp-movement-test.ts
  note: Tryton executes real reservation commit (move draft -> assigned) and release (-> cancelled) as stock movements; the accounting projection is staging_test_clearing with bank_receipt_claimed=false and zero posted account.move. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06.
  acceptance_criteria:
  - Tryton executes actual staging reservation commit/release and stock movement.
  - Approved staging accounting projection uses test-clearing treatment.
  - No projection claims bank receipt or affects production accounting.
- id: E-017-018
  title: Cross-system staging reconciliation
  decisions: [D-017-15, D-017-17, D-017-18, D-017-19]
  required_roles: [architecture, operations, marketplace, erp-operations, finance-tax]
  status: accepted
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/payment-simulation-acceptance.md
  - client-projects/client101/evidence/CHG-017/event-consumers-operations.md
  - client-projects/client101/evidence/CHG-017/erp-reconciliation-connectivity.md
  - services/experience-api/src/scripts/payment-flow-test.ts
  - services/experience-api/src/scripts/reconciliation-test.ts
  note: Checkout/order/allocation/reservation share one correlation reference; a missing reservation is a visible mismatch (with recovery_actions) and is recoverable through the reserve/commit API without direct DB edits; reconciliation reflects the real Tryton move state and preserves test markers in every projection. Accepted for the bounded staging pilot by the accountable owner (RS), 2026-10-06.
  acceptance_criteria:
  - Checkout, Medusa order, Mercur allocation, Tryton reservation/movement/accounting share correlation references.
  - Mismatches are visible and recoverable without direct database edits.
  - Simulated/test markers are preserved in every projection.
- id: E-017-019
  title: Shared backend client and operations connectivity
  decisions: [D-017-02, D-017-14, D-017-18]
  required_roles: [architecture, security, operations, product]
  status: evidenced
  owner: RS
  evidence_refs:
  - apps/prototype_app/lib/screens/checkout_screen.dart
  - apps/prototype_app/test/checkout_canonical_flow_test.dart
  - apps/web/lib/experience-api.ts
  - apps/web/app/api/checkout/route.ts
  - client-projects/client101/contracts/openapi/buildkart-experience-v1.yaml
  - client-projects/client101/evidence/CHG-017/event-consumers-operations.md
  - client-projects/client101/evidence/CHG-017/erp-reconciliation-connectivity.md
  - client-projects/client101/evidence/CHG-017/web-surface.md
  - services/experience-api/src/scripts/connectivity-test.ts
  note: App (Flutter) + web (Next.js) + operator (/ops, /v1/admin) surfaces consume the shared backend with visible environment/freshness/test markers; neither app nor web can manufacture success (server-verified canonical simulated order); seller/operator dashboards are the Mercur surfaces; cross-system consumers expose lag/dead-letter metrics. All listed criteria evidenced; human acceptance remains.
  acceptance_criteria:
  - App, web, seller and operator screens consume shared backend contracts.
  - No client fixture or local flag can manufacture transactional success.
  - Permission, version, freshness and test-data markers are visible.
- id: E-017-020
  title: Environment routing and production-effect isolation
  decisions: [D-017-14, D-017-21, D-017-23]
  required_roles: [architecture, security, operations, integration-owners, release-authority]
  status: evidenced
  owner: RS
  evidence_refs:
  - client-projects/client101/evidence/CHG-017/production-isolation.md
  - services/experience-api/src/scripts/isolation-test.ts
  - services/experience-api/src/config.ts
  - services/backend/packages/api/src/config/payment-runtime.ts
  note: Staging routing is local and credential-free (GET /v1/admin/environment, redacted, 404 in production); production+simulated and provider mode fail closed in both the Experience API and Medusa registration; simulated adapters are network-free; environment/test markers are visible everywhere. Human acceptance remains.
  acceptance_criteria:
  - Staging uses environment-specific endpoints, service identities and secret references.
  - Production ERP, live payments, production logistics and customer notifications are unreachable.
  - Unsafe routing or simulated payment in production fails closed.
- id: E-017-021
  title: Editorial CMS app-content boundary
  decisions: [D-017-01, D-017-02, D-017-21]
  required_roles: [product, architecture, security]
  status: planned
  owner: RS
  evidence_refs: [docs/architecture/provider-selection-decision-records.md]
  note: Strapi (self-hosted) selected for editorial app-shell content behind a provider-neutral CMS boundary; CMS never owns transactional state.
  acceptance_criteria:
  - CMS or governed seed supplies only editorial app-shell content through the shared backend.
  - CMS cannot own or calculate transactional state.
  - CMS failure cannot block or manufacture order processing.
