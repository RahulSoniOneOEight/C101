# BuildKart Configurable Rule Registry — machine-readable rule inventory.
# Companion to docs/architecture/configurable-rules-framework.md.
# Statuses: provider-supported | hardcoded-in-flutter | fixture-backed | new-capability | pending-approval
# This registry REFERENCES owners; it never computes prices, eligibility, stock or tax.

schema_version: 1
status: proposed
source: docs/architecture/configurable-rules-framework.md
change_contract: CHG-017
precedence: [account-sku, seller-sku, category-account-segment, channel-region, global-default]

