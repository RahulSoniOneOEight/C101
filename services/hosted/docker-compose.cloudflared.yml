name: buildkart-hosted-pilot

# Optional Cloudflare Tunnel edge.
#
# Use this when the zone's nameservers are on Cloudflare and the public hostnames are proxied
# CNAMEs to the tunnel (`<tunnel-id>.cfargotunnel.com`). The tunnel is a second ingress path next to
# Coolify's Traefik; both reach the same nginx `proxy`.
#
# The tunnel token is held only on the host:
#
#   /etc/buildkart/secrets/cloudflared.env   TUNNEL_TOKEN=...
#
# with mode 600. It is never committed. The tunnel ingress (public hostname -> proxy and the origin
# Host header) is stored in Cloudflare and managed through the API.
#
#   docker compose -f docker-compose.hosted.yml -f docker-compose.cloudflared.yml up -d --no-deps proxy cloudflared

services:
  proxy:
    networks: [private, coolify, tunnel]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: /etc/buildkart/secrets/cloudflared.env
    depends_on: [proxy]
    networks: [tunnel]

networks:
  tunnel:
