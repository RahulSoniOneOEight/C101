name: buildkart-hosted-pilot

# Edge: the Customer host (`PUBLIC_API_HOSTNAME`) and the Operator host (`PUBLIC_OPS_HOSTNAME`) are
# terminated by Coolify's existing Traefik on :80/:443 (Let's Encrypt). The `proxy` service joins
# the external `coolify` network and publishes no host ports. The optional Cloudflare Tunnel edge is
# in docker-compose.cloudflared.yml instead. Only the proxy is reachable from outside.

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/redis.env
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/nats.env
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec nats-server -js -sd /data --user \"$$NATS_USER\" --pass \"$$NATS_PASSWORD\" -m 8222"]
    volumes:
      - nats_data:/data
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  medusa-migrate:
    image: buildkart-hosted-pilot-medusa
    build:
      context: ../backend
      args:
        MERCUR_BACKEND_URL: ${MERCUR_BACKEND_URL:?set MERCUR_BACKEND_URL}
    env_file: /etc/buildkart/secrets/medusa.env
    command: ["npm", "run", "predeploy"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
    restart: "no"

  medusa-api:
    image: buildkart-hosted-pilot-medusa
    build:
      context: ../backend
      args:
        MERCUR_BACKEND_URL: ${MERCUR_BACKEND_URL:?set MERCUR_BACKEND_URL}
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/medusa.env
    environment:
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "true"
      PORT: "9010"
      # Native Content workspace facade. The browser only calls Medusa; this private origin and
      # CMS_OPERATOR_SECRET from medusa.env are never emitted into the dashboard bundle.
      CMS_OPERATOR_BASE_URL: http://cms:1337
      # Private draft preview projection. EXPERIENCE_OPERATOR_SECRET from medusa.env is distinct from
      # the CMS operator secret so no secret is reused across trust boundaries.
      EXPERIENCE_OPERATOR_BASE_URL: http://experience-api:9020
    depends_on:
      medusa-migrate: {condition: service_completed_successfully}
      cms: {condition: service_healthy}
    networks: [private]
    volumes:
      # Catalogue images are uploaded through the local file provider. Without a persistent volume they
      # live in the container layer and vanish on the next recreate, which is exactly what happens on
      # every release. Same volume on the worker so both see the same files.
      - medusa_uploads:/app/packages/api/static
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  medusa-worker:
    image: buildkart-hosted-pilot-medusa
    build:
      context: ../backend
      args:
        MERCUR_BACKEND_URL: ${MERCUR_BACKEND_URL:?set MERCUR_BACKEND_URL}
    restart: unless-stopped
    env_file:
      - /etc/buildkart/secrets/medusa.env
      - /etc/buildkart/secrets/nats.env
    environment:
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      PORT: "9011"
      NATS_URL: nats://nats:4222
    depends_on:
      medusa-migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
      experience-api: {condition: service_healthy}
    networks: [private]
    volumes:
      - medusa_uploads:/app/packages/api/static

  tryton:
    build: ../tryton
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/tryton.env
    volumes:
      - /etc/buildkart/trytond.conf:/etc/tryton/trytond.conf:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  # B2B collaboration kernel. Phase 1 owns workspaces, channels, messages and
  # activity in its own database. It is private: clients reach it only through
  # the Experience API's signed actor-context proxy.
  workspace:
    image: buildkart-hosted-pilot-workspace
    build: ../workspace
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/workspace.env
    environment:
      PORT: "9040"
      BUILDKART_ENVIRONMENT: staging
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  experience-api:
    image: buildkart-hosted-pilot-experience-api
    build: ../experience-api
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/experience-api.env
    environment:
      PORT: "9020"
      CMS_BASE_URL: http://cms:1337
      WORKSPACE_SERVICE_URL: http://workspace:9040
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
      medusa-api: {condition: service_healthy}
      workspace: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:9020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  event-workers:
    image: buildkart-hosted-pilot-experience-api
    build: ../experience-api
    command: ["bun", "run", "start:workers"]
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/experience-api.env
    environment:
      WORKERS_METRICS_PORT: "9030"
    depends_on:
      experience-api: {condition: service_healthy}
    networks: [private, egress]

  # Editorial CMS (Strapi v5). Owns editorial content only, in its own database.
  # Not published at the edge: exposing the Strapi admin requires the deferred access layer
  # (Cloudflare Access and operator RBAC hardening), so it stays reachable only on the private
  # network for the Experience API content adapter. A dedicated bridge exists only so Docker can
  # realize the loopback-bound SSH-tunnel port; no public service joins that bridge.
  cms:
    image: buildkart-hosted-pilot-cms
    build: ../cms
    restart: unless-stopped
    env_file: /etc/buildkart/secrets/cms.env
    environment:
      CMS_WEBHOOK_URL: http://experience-api:9020/v1/internal/cms/webhooks
    # Loopback only: permits an SSH tunnel for initial admin/API-token setup without edge exposure.
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private, cms_admin]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Internal reverse proxy: host-based privilege policy + rate limiting. Public only through Traefik.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - envsubst '$$PUBLIC_API_HOSTNAME $$PUBLIC_OPS_HOSTNAME' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    environment:
      PUBLIC_API_HOSTNAME: ${PUBLIC_API_HOSTNAME:?set PUBLIC_API_HOSTNAME}
      PUBLIC_OPS_HOSTNAME: ${PUBLIC_OPS_HOSTNAME:?set PUBLIC_OPS_HOSTNAME}
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    depends_on:
      experience-api: {condition: service_healthy}
      tryton: {condition: service_started}
    networks: [private, coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.services.buildkart-proxy.loadbalancer.server.port: "8080"
      # Customer host
      traefik.http.routers.buildkart-api.rule: "Host(`${PUBLIC_API_HOSTNAME}`)"
      traefik.http.routers.buildkart-api.entrypoints: "https"
      traefik.http.routers.buildkart-api.tls: "true"
      traefik.http.routers.buildkart-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.buildkart-api.service: "buildkart-proxy"
      traefik.http.routers.buildkart-api-http.rule: "Host(`${PUBLIC_API_HOSTNAME}`)"
      traefik.http.routers.buildkart-api-http.entrypoints: "http"
      traefik.http.routers.buildkart-api-http.middlewares: "buildkart-redirect"
      traefik.http.routers.buildkart-api-http.service: "buildkart-proxy"
      # Operator host
      traefik.http.routers.buildkart-ops.rule: "Host(`${PUBLIC_OPS_HOSTNAME}`)"
      traefik.http.routers.buildkart-ops.entrypoints: "https"
      traefik.http.routers.buildkart-ops.tls: "true"
      traefik.http.routers.buildkart-ops.tls.certresolver: "letsencrypt"
      traefik.http.routers.buildkart-ops.service: "buildkart-proxy"
      traefik.http.routers.buildkart-ops-http.rule: "Host(`${PUBLIC_OPS_HOSTNAME}`)"
      traefik.http.routers.buildkart-ops-http.entrypoints: "http"
      traefik.http.routers.buildkart-ops-http.middlewares: "buildkart-redirect"
      traefik.http.routers.buildkart-ops-http.service: "buildkart-proxy"
      traefik.http.middlewares.buildkart-redirect.redirectscheme.scheme: "https"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  medusa_uploads:

networks:
  # Backend services only; no route to the public internet or the host.
  private:
    internal: true
  # Outbound-only for FCM/provider calls when enabled.
  egress:
  # Dedicated host bridge for the CMS loopback binding. The private network alone is `internal`,
  # which intentionally suppresses Docker host port publication.
  cms_admin:
  # Coolify's existing Traefik network (created by Coolify).
  coolify:
    external: true
