worker_processes auto;

events {
  worker_connections 2048;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Reverse proxy for the bounded-staging pilot. The Experience API (:9020) serves the composed
  # storefront/checkout surface; Medusa/Mercur (:9010) serves the raw store API. Both run on the
  # host; the containers reach them via host.docker.internal.
  # Upstream keepalive is intentionally disabled: the Bun upstream closes idle connections, and
  # reusing a stale pooled connection adds latency/502s. A fresh connection to the host is ~2ms.
  upstream experience_api {
    server host.docker.internal:9020 max_fails=0;
  }

  upstream medusa {
    server host.docker.internal:9010 max_fails=0;
  }

  server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /health {
      proxy_pass http://experience_api/health;
    }

    location = /metrics {
      proxy_pass http://experience_api/metrics;
    }

    location /v1/ {
      proxy_pass http://experience_api;
    }

    location /ops {
      proxy_pass http://experience_api;
    }

    location /store/ {
      proxy_pass http://medusa;
    }

    location / {
      return 404;
    }
  }
}
